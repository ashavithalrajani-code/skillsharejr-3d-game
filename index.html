function terrainHeight(x,z){

return(
Math.sin(x*.055)*.55+
Math.cos(z*.06)*.55+
Math.sin((x+z)*.035)*.25
);

}

/* =========================
   GROUND
========================= */

function createGround(){

const geo=
new THREE.PlaneGeometry(
120,
100,
100,
100
);

const position=
geo.attributes.position;

for(let i=0;i<position.count;i++){

const x=position.getX(i);
const z=position.getY(i);

position.setZ(
i,
terrainHeight(x,z)
);

}

geo.computeVertexNormals();


const material=
new THREE.MeshStandardMaterial({
color:0x4e944d,
roughness:1
});


const ground=
new THREE.Mesh(
geo,
material
);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);

}

road.rotation.y=rotation;

road.receiveShadow=true;

scene.add(road);

function makeTree(x,z){

const g=
new THREE.Group();

g.position.set(
x,
terrainHeight(x,z),
z
);


const trunk=
new THREE.Mesh(
new THREE.CylinderGeometry(
.3,
.46,
3.3,
10
),
new THREE.MeshStandardMaterial({
color:0x633f23
})
);

trunk.position.y=1.65;

trunk.castShadow=true;

g.add(trunk);


for(let i=0;i<3;i++){

const leaves=
new THREE.Mesh(
new THREE.ConeGeometry(
2.5-i*.25,
3.1,
10
),
new THREE.MeshStandardMaterial({
color:
i===0
?0x194f2d
:i===1
?0x267139
:0x338442
})
);

leaves.position.y=
4+i*1.25;

leaves.castShadow=true;

g.add(leaves);

}

scene.add(g);


obstacles.push({
x:x,
z:z,
radius:1.8
});

}


function createTrees(){

let count=0;

while(count<70){

const x=
(Math.random()-.5)*105;

const z=
(Math.random()-.5)*75;


if(
Math.abs(x)<10 &&
Math.abs(z)<10
){

continue;

}


let tooClose=false;


for(const loc of locations){

if(
Math.hypot(
x-loc.x,
z-loc.z
)<10
){

tooClose=true;
break;

}

}


if(tooClose)continue;

makeTree(x,z);

count++;

}

}

/* =========================
   ANIMATION
========================= */

function animateCharacter(dt){

const legs=
player.userData.legs;

const arms=
player.userData.arms;


if(walking){

walkTime+=dt*9;

const swing=
Math.sin(walkTime);

const opposite=
Math.sin(
walkTime+Math.PI
);


/* LEGS */

legs[0].thigh.rotation.x=
swing*.5;

legs[1].thigh.rotation.x=
opposite*.5;


/* LOWER LEGS */

legs[0].shin.rotation.x=
Math.max(0,-swing)*.75;

legs[1].shin.rotation.x=
Math.max(0,-opposite)*.75;


/* ARMS */

arms[0].shoulder.rotation.x=
-opposite*.38;

arms[1].shoulder.rotation.x=
-swing*.38;


/* BODY */

player.position.y=
terrainHeight(
player.position.x,
player.position.z
)+
Math.abs(
Math.sin(walkTime*2)
)*.045;

}else{

legs.forEach(l=>{

l.thigh.rotation.x=
THREE.MathUtils.lerp(
l.thigh.rotation.x,
0,
.18
);

l.shin.rotation.x=
THREE.MathUtils.lerp(
l.shin.rotation.x,
0,
.18
);

});


arms.forEach(a=>{

a.shoulder.rotation.x=
THREE.MathUtils.lerp(
a.shoulder.rotation.x,
0,
.18
);

a.forearm.rotation.x=
THREE.MathUtils.lerp(
a.forearm.rotation.x,
0,
.18
);

});


player.position.y=
terrainHeight(
player.position.x,
player.position.z
);

}

}

/* =========================
   COLLISION
========================= */

function canMove(x,z){

if(
x<-55 ||
x>55 ||
z<-45 ||
z>45
){

return false;

}


for(const o of obstacles){

if(
Math.hypot(
x-o.x,
z-o.z
)<
1.0+o.radius
){

return false;

}

}

return true;

}


/* =========================
   INPUT
========================= */

function setupInput(){

window.addEventListener(
"keydown",
e=>{

keys[
e.key.toLowerCase()
]=true;


if(
e.key.toLowerCase()==="e" &&
nearby
){

openChallenge(nearby);

}

});


window.addEventListener(
"keyup",
e=>{

keys[
e.key.toLowerCase()
]=false;

});


renderer.domElement.addEventListener(
"click",
()=>{

renderer.domElement.requestPointerLock();

});


document.addEventListener(
"mousemove",
e=>{

if(
document.pointerLockElement===
renderer.domElement
){

yaw-=
e.movementX*.0025;

pitch-=
e.movementY*.002;

pitch=
THREE.MathUtils.clamp(
pitch,
-.4,
.25
);

}

});


document.getElementById(
"next"
).onclick=
nextQuestion;

document.getElementById(
"close"
).onclick=
closeChallenge;

document.getElementById(
"return"
).onclick=
closeChallenge;

}


/* =========================
   MOVEMENT
========================= */

function updateMovement(){

if(
document.getElementById(
"challenge"
).style.display==="flex"
){

walking=false;

return;

}


let forward=0;
let side=0;


if(keys["w"])
forward=1;

if(keys["s"])
forward=-1;

if(keys["a"])
side=-1;

if(keys["d"])
side=1;


walking=
forward!==0 ||
side!==0;


if(!walking)return;


const length=
Math.hypot(
forward,
side
);

forward/=length;
side/=length;


const speed=
keys["shift"]
?0.3
:0.16;


const fx=
-Math.sin(yaw);

const fz=
-Math.cos(yaw);

const rx=
Math.cos(yaw);

const rz=
-Math.sin(yaw);


const dx=
(
fx*forward+
rx*side
)*speed;

const dz=
(
fz*forward+
rz*side
)*speed;


const nx=
player.position.x+dx;

const nz=
player.position.z+dz;


if(
canMove(
nx,
player.position.z
)
){

player.position.x=nx;

}


if(
canMove(
player.position.x,
nz
)
){

player.position.z=nz;

}


if(
Math.abs(dx)+
Math.abs(dz)>.001
){

const targetRotation=
Math.atan2(
dx,
dz
);

player.rotation.y=
THREE.MathUtils.lerp(
player.rotation.y,
targetRotation,
.15
);

}

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

const distance=9;

const horizontal=
Math.cos(pitch)*distance;

const vertical=
Math.sin(pitch)*distance;


const targetX=
player.position.x+
Math.sin(yaw)*horizontal;

const targetZ=
player.position.z+
Math.cos(yaw)*horizontal;

const targetY=
player.position.y+
4.4+
vertical;


camera.position.lerp(
new THREE.Vector3(
targetX,
targetY,
targetZ
),
.1
);


camera.lookAt(
player.position.x,
player.position.y+2.2,
player.position.z
);

}


/* =========================
   NEARBY
========================= */

function updateNearby(){

nearby=null;

let closest=999;


for(const loc of locations){

const d=
Math.hypot(
player.position.x-loc.x,
player.position.z-loc.z
);


if(
d<9 &&
d<closest
){

closest=d;
nearby=loc;

}

}


const interact=
document.getElementById(
"interact"
);


if(nearby){

interact.style.display="block";

interact.innerHTML=
"🏛️ <b>E</b> — "+
nearby.title;

}else{

interact.style.display="none";

}

}


/* =========================
   CHALLENGE SYSTEM
========================= */

let currentLocation=null;
let qIndex=0;
let score=0;
let answered=false;


function openChallenge(loc){

currentLocation=loc;

qIndex=0;
score=0;
answered=false;


document.getElementById(
"challenge"
).style.display="flex";


document.getElementById(
"gameQuestions"
).style.display="block";


document.getElementById(
"result"
).style.display="none";


loadQuestion();

}


function loadQuestion(){

answered=false;


const q=
currentLocation.questions[
qIndex
];


document.getElementById(
"category"
).textContent=
currentLocation.name;


document.getElementById(
"title"
).textContent=
currentLocation.title;


document.getElementById(
"number"
).textContent=
"Question "+
(qIndex+1)+
" / "+
currentLocation.questions.length;


document.getElementById(
"question"
).textContent=q.q;


const answers=
document.getElementById(
"answers"
);

answers.innerHTML="";


q.a.forEach(
(text,i)=>{

const b=
document.createElement(
"button"
);

b.className="answer";

b.textContent=
String.fromCharCode(
65+i
)+
". "+
text;

b.onclick=
()=>chooseAnswer(
i,
b
);

answers.appendChild(b);

});


document.getElementById(
"feedback"
).textContent="";

document.getElementById(
"feedback"
).className="";

document.getElementById(
"next"
).style.display="none";

}


function chooseAnswer(i,button){

if(answered)return;

answered=true;


const q=
currentLocation.questions[
qIndex
];


const buttons=
document.querySelectorAll(
".answer"
);


buttons.forEach(
(b,index)=>{

b.disabled=true;

if(index===q.c){

b.classList.add(
"correct"
);

}

});


const feedback=
document.getElementById(
"feedback"
);


if(i===q.c){

score++;

feedback.textContent=
"✅ Correct!";

feedback.className="good";

}else{

button.classList.add(
"wrong"
);

feedback.textContent=
"❌ Not quite — the correct answer is highlighted.";

feedback.className="bad";

}


document.getElementById(
"next"
).style.display="inline-block";


document.getElementById(
"next"
).textContent=
qIndex<
currentLocation.questions.length-1
?
"Next Question →"
:
"Finish Challenge 🏆";

}


function nextQuestion(){

if(
qIndex<
currentLocation.questions.length-1
){

qIndex++;

loadQuestion();

}else{

finishChallenge();

}

}


function finishChallenge(){

const total=
currentLocation.questions.length;

const percent=
Math.round(
score/total*100
);


let earnedXP=50;
let earnedGems=3;


if(percent===100){

earnedXP=150;
earnedGems=10;

}else if(percent>=66){

earnedXP=100;
earnedGems=6;

}


xp+=earnedXP;

gems+=earnedGems;

done++;

level=
Math.floor(xp/300)+1;


updateStats();


document.getElementById(
"gameQuestions"
).style.display="none";


document.getElementById(
"result"
).style.display="block";


document.getElementById(
"resultText"
).textContent=
"You scored "+
score+
" / "+
total+
" ("+
percent+
"%).";


document.getElementById(
"reward"
).textContent=
"⭐ +"+
earnedXP+
" XP     💎 +"+
earnedGems+
" Gems";


document.getElementById(
"questText"
).textContent=
"🎉 Challenge complete! Find another building.";

}


function closeChallenge(){

document.getElementById(
"challenge"
).style.display="none";

currentLocation=null;

}


/* =========================
   STATS
========================= */

function updateStats(){

document.getElementById(
"xp"
).textContent=xp;

document.getElementById(
"gems"
).textContent=gems;

document.getElementById(
"level"
).textContent=level;

document.getElementById(
"done"
).textContent=done;

}


/* =========================

========================= */

function resize(){

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio,
2
)
);

}


/* =========================
   GAME LOOP
========================= */

function animate(){

requestAnimationFrame(
animate
);


const now=
performance.now();

const dt=
Math.min(
(now-lastTime)/1000,
.05
);

lastTime=now;


updateMovement();

animateCharacter(dt);

updateCamera();

updateNearby();


renderer.render(
scene,
camera
);

}


/* =========================
   LOADING
========================= */

let loading=0;

const timer=
setInterval(
()=>{

loading+=5;


document.getElementById(
"progress"
).style.width=
loading+"%";


if(loading>=100){

clearInterval(timer);

document.getElementById(
"loading"
).style.display="none";

init();

}

},
40
);

</script>
