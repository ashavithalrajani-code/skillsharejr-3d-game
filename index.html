/* =========================================================
   TERRAIN HEIGHT
   ========================================================= */

function terrainHeight(x,z){

    return (
        Math.sin(x*0.075)*1.3+
        Math.cos(z*0.08)*1.15+
        Math.sin(x*0.17+z*0.11)*0.4+
        Math.cos((x-z)*0.045)*0.6
    );
}


/* =========================================================
   START
   ========================================================= */

function startGame(){

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x87ceeb);

    scene.fog=
        new THREE.Fog(
            0x87ceeb,
            65,
            190
        );


    camera=
        new THREE.PerspectiveCamera(
            62,
            innerWidth/innerHeight,
            0.1,
            500
        );


    /* HIGH QUALITY RENDERER */

    renderer=
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:"high-performance"
        });


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type=
        THREE.PCFSoftShadowMap;


    renderer.outputEncoding=
        THREE.sRGBEncoding;


    renderer.toneMapping=
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure=1.15;


    document
        .getElementById("game")
        .appendChild(renderer.domElement);


    /* =====================================================
       LIGHTING
       ===================================================== */

    const hemisphere=
        new THREE.HemisphereLight(
            0xd5f3ff,
            0x284523,
            1.8
        );

    scene.add(hemisphere);


    const sun=
        new THREE.DirectionalLight(
            0xfff0cf,
            2.4
        );

    sun.position.set(
        -65,
        110,
        45
    );


    sun.castShadow=true;


    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;


    sun.shadow.camera.left=-100;
    sun.shadow.camera.right=100;
    sun.shadow.camera.top=100;
    sun.shadow.camera.bottom=-100;


    sun.shadow.camera.near=1;
    sun.shadow.camera.far=250;


    sun.shadow.bias=-0.0002;


    scene.add(sun);


    /* WORLD */

    createTerrain();
    createWater();
    createRoadNetwork();
    createMountains();
    createBuildings();
    createTrees();
    createRocks();
    createFlowers();
    createPlayer();
    createSkyDecorations();

    setupControls();
    setupMouse();

    window.addEventListener(
        "resize",
        resize
    );


    setTimeout(
        ()=>{
            document
                .getElementById("loading")
                .style.display="none";
        },
        700
    );


    animate();
}


/* =========================================================
   TERRAIN
   ========================================================= */

function createTerrain(){

    const geometry=
        new THREE.PlaneGeometry(
            130,
            110,
            120,
            120
        );


    const position=
        geometry.attributes.position;


    for(
        let i=0;
        i<position.count;
        i++
    ){

        const x=
            position.getX(i);

        const z=
            position.getY(i);


        position.setZ(
            i,
            terrainHeight(x,z)
        );
    }


    geometry.computeVertexNormals();


    const material=
        new THREE.MeshStandardMaterial({
            color:0x4d8b48,
            roughness:1,
            metalness:0
        });


    const ground=
        new THREE.Mesh(
            geometry,
            material
        );


    ground.rotation.x=
        -Math.PI/2;


    ground.receiveShadow=true;


    scene.add(ground);
}


/* =========================================================
   WATER
   ========================================================= */

function createWater(){

    const water=
        new THREE.Mesh(
            new THREE.CircleGeometry(
                14,
                64
            ),
            new THREE.MeshStandardMaterial({
                color:0x159bd1,
                roughness:.08,
                metalness:.18,
                transparent:true,
                opacity:.86
            })
        );


    water.rotation.x=
        -Math.PI/2;


    water.position.set(
        42,
        .25,
        -27
    );


    scene.add(water);


    animatedObjects.push({
        object:water,
        type:"water"
    });
}


/* =========================================================
   ROAD
   ========================================================= */

function road(
    x,z,
    width,length,
    rotation=0
){

    const r=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .15,
                length
            ),
            new THREE.MeshStandardMaterial({
                color:0x8c684d,
                roughness:1
            })
        );


    r.position.set(
        x,
        terrainHeight(x,z)+.05,
        z
    );


    r.rotation.y=
        rotation;


    r.receiveShadow=true;


    scene.add(r);
}


function createRoadNetwork(){

    road(0,0,6,100);
    road(0,0,6,100,Math.PI/2);

    road(-17,-18,4,34,-.65);
    road(18,-12,4,35,.78);
    road(-17,24,4,30,.55);
}

        [30,-50,14,30],
        [57,-43,17,37]

    walls.castShadow=true;

    /* UPPER FLOOR */

    /* WINDOWS */

    [-2.1,2.1].forEach(

            );

    );


    /* BALCONY */

    const balcony=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,

                color:0x343e46

/* =========================================================
   TREES
   ========================================================= */

function createTree(x,z){

    const group=
        new THREE.Group();


    group.position.set(
        x,
        terrainHeight(x,z),
        z
    );


    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .32,
                .5,
                3.6,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x624027,
                roughness:1
            })
        );


    trunk.position.y=1.8;
    trunk.castShadow=true;


    group.add(trunk);


    const shades=[
        0x15532e,
        0x1f6c35,
        0x2b803c
    ];


    for(
        let i=0;
        i<3;
        i++
    ){

        const leaves=
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    2.5-i*.3,
                    3.2,
                    10
                ),
                new THREE.MeshStandardMaterial({
                    color:shades[i],
                    roughness:1
                })
            );


        leaves.position.y=
            4+i*1.55;


        leaves.castShadow=true;


        group.add(leaves);
    }


    scene.add(group);


    obstacles.push({
        x:x,
        z:z,
        radius:1.8
    });
}


function createTrees(){

    let count=0;


    while(count<100){

        const x=
            (Math.random()-.5)*106;

        const z=
            (Math.random()-.5)*82;


        if(
            Math.abs(x)<13 &&
            Math.abs(z)<13
        ) continue;


        let bad=false;


        locations.forEach(
            loc=>{

                const dx=
                    x-loc.x;

                const dz=
                    z-loc.z;


                if(
                    Math.sqrt(
                        dx*dx+dz*dz
                    )<10
                ){

                    bad=true;
                }
            }
        );


        if(bad) continue;


        createTree(x,z);

        count++;
    }
}


/* =========================================================
   ROCKS
   ========================================================= */

function createRocks(){

    for(
        let i=0;
        i<50;
        i++
    ){

        const x=
            (Math.random()-.5)*105;

        const z=
            (Math.random()-.5)*80;


        const scale=
            .45+
            Math.random()*.9;


        const rock=
            new THREE.Mesh(
                new THREE.DodecahedronGeometry(
                    scale,
                    1
                ),
                new THREE.MeshStandardMaterial({
                    color:0x657278,
                    roughness:1
                })
            );


        rock.position.set(
            x,
            terrainHeight(x,z)+scale*.4,
            z
        );


        rock.rotation.set(
            Math.random(),
            Math.random(),
            Math.random()
        );


        rock.castShadow=true;


        scene.add(rock);


        obstacles.push({
            x:x,
            z:z,
            radius:scale*.8
        });
    }
}

/* =========================================================
   COLLISION
   ========================================================= */

function canMoveTo(x,z){

    const radius=1.05;


    for(
        let i=0;
        i<obstacles.length;
        i++
    ){

        const o=
            obstacles[i];


        const dx=x-o.x;
        const dz=z-o.z;


        const distance=
            Math.sqrt(
                dx*dx+
                dz*dz
            );


        if(
            distance<
            radius+o.radius
        ){

            return false;
        }
    }


    return true;
}

        "keydown",

            keys[

                e.key.toLowerCase()==="e" &&
                nearby

                openLesson(nearby);
            }

        e=>{

            ]=false;
        }

}


/* =========================================================
   MOUSE CAMERA
   ========================================================= */

function setupMouse(){

    renderer.domElement.addEventListener(
        "click",
        ()=>{
            renderer
                .domElement
                .requestPointerLock();
        }
    );


    document.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement
                !==renderer.domElement
            ) return;


            yaw-=
                e.movementX*.0025;


            pitch-=
                e.movementY*.002;


            pitch=
                THREE.MathUtils.clamp(
                    pitch,
                    -.65,
                    .25
                );
        }
    );
}


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(){

    let forward = 0;
    let strafe = 0;

    // W = FORWARD
    if(keys["w"]) forward += 1;

    // S = BACKWARD
    if(keys["s"]) forward -= 1;

    // A = LEFT
    if(keys["a"]) strafe -= 1;

    // D = RIGHT
    if(keys["d"]) strafe += 1;

    if(forward === 0 && strafe === 0){

        player.position.y =
            terrainHeight(
                player.position.x,
                player.position.z
            );

        return;
    }

    const length = Math.sqrt(
        forward * forward +
        strafe * strafe
    );

    forward /= length;
    strafe /= length;

    const speed =
        keys["shift"] ? 0.30 : 0.15;

    // Forward direction
    const forwardX = Math.sin(yaw);
    const forwardZ = Math.cos(yaw);

    // Right direction
    const rightX = Math.cos(yaw);
    const rightZ = -Math.sin(yaw);

    const moveX =
        (forwardX * forward +
         rightX * strafe) * speed;

    const moveZ =
        (forwardZ * forward +
         rightZ * strafe) * speed;

    const newX =
        player.position.x + moveX;

    const newZ =
        player.position.z + moveZ;

    // Collision
    if(
        canMoveTo(
            newX,
            player.position.z
        )
    ){
        player.position.x = newX;
    }

    if(
        canMoveTo(
            player.position.x,
            newZ
        )
    ){
        player.position.z = newZ;
    }

    // Keep player on ground
    player.position.y =
        terrainHeight(
            player.position.x,
            player.position.z
        );

    // Face movement direction
    if(
        Math.abs(moveX) +
        Math.abs(moveZ) > 0.001
    ){

        const targetRotation =
            Math.atan2(
                moveX,
                moveZ
            );

        player.rotation.y =
            THREE.MathUtils.lerp(
                player.rotation.y,
                targetRotation,
                0.18
            );
    }
}{

    let strafe = 0;

    // W = FORWARD
    if(keys["w"]) forward += 1;

    // S = BACKWARD
    if(keys["s"]) forward -= 1;

    // Collision
    if(

    }

    if(

    ){

    }

    // Keep player on ground
    player.position.y =

        );

    // Face movement direction
    if(
        Math.abs(moveX) +

    ){

            Math.atan2(

            );

        player.rotation.y =

}{

    let side=0;


    if(keys["w"]) forward++;
    if(keys["s"]) forward--;

    if(keys["d"]) side++;
    if(keys["a"]) side--;


    if(
        forward===0 &&

    ){

        player.position.y=
            terrainHeight(
                player.position.x,
                player.position.z
            );

        return;
    }


    const length=
        Math.sqrt(
            forward*forward+
            side*side
        );


    forward/=length;
    side/=length;


    const speed=
        keys["shift"]
        ?0.30
        :0.15;


    const moveX=
        (
            Math.sin(yaw)*forward+
            Math.cos(yaw)*side
        )*speed;


    const moveZ=
        (

        )*speed;


    const newX=
        player.position.x+

/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){

    const distance=11;


    const horizontal=
        Math.cos(pitch)*distance;


    const vertical=
        Math.sin(pitch)*distance;


    const target=
        new THREE.Vector3(

            player.position.x-
            Math.sin(yaw)*horizontal,

            player.position.y+
            5-
            vertical,

            player.position.z-
            Math.cos(yaw)*horizontal
        );


    camera.position.lerp(
        target,
        .08
    );


    camera.lookAt(
        player.position.x,
        player.position.y+2,
        player.position.z
    );
}


/* =========================================================
   NEARBY LOCATIONS
   ========================================================= */

function checkNearby(){

    nearby=null;

    let closest=999;


    locations.forEach(
        loc=>{

            const dx=
                player.position.x-loc.x;

            const dz=
                player.position.z-loc.z;


            const distance=
                Math.sqrt(
                    dx*dx+
                    dz*dz
                );


            if(
                distance<11 &&
                distance<closest
            ){

                closest=distance;
                nearby=loc;
            }
        }
    );


    const box=
        document.getElementById(
            "interact"
        );


    if(nearby){

        box.style.display="block";

        box.innerHTML=
            "🏛️ Press <b>E</b> to learn: "+
            nearby.name;

    }else{

        box.style.display="none";
    }
}


/* =========================================================
   LESSON
   ========================================================= */

function openLesson(loc){

    document
        .getElementById("lesson")
        .style.display="flex";


    document
        .getElementById("lessonTitle")
        .textContent=
        loc.title;


    document
        .getElementById("lessonIntro")
        .textContent=
        loc.intro;


    document
        .getElementById("lessonContent")
        .innerHTML=
        loc.lesson;


    document
        .getElementById("challenge")
        .textContent=
        loc.challenge;
}


function closeLesson(){

    document
        .getElementById("lesson")
        .style.display="none";
}


function finishLesson(){

    xp+=100;
    gems+=5;

    level=
        Math.floor(xp/300)+1;


    document
        .getElementById("xp")
        .textContent=xp;


    document
        .getElementById("gems")
        .textContent=gems;


    document
        .getElementById("level")
        .textContent=level;


    document
        .getElementById("questText")
        .textContent=
        "🎉 Lesson completed! Find another learning location.";


    closeLesson();
}


/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

    camera.aspect=
        innerWidth/innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight,
        false
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );
}


/* =========================================================
   ANIMATION
   ========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();
    updateCamera();
    checkNearby();


    const time=
        performance.now()/1000;


    animatedObjects.forEach(
        item=>{

            if(
                item.type==="crystal"
            ){

                item.object.rotation.y=
                    time*1.7;


                item.object.position.y=
                    14+
                    Math.sin(time*2.4)*.45;
            }


            if(
                item.type==="water"
            ){

                item.object.material.opacity=
                    .78+
                    Math.sin(time*1.4)*.06;
            }
        }
    );


    renderer.render(
        scene,
        camera
    );
}

            if(progress>=100){

                clearInterval(
