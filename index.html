/* =========================================================
   TERRAIN HEIGHT
   ========================================================= */

function terrainHeight(x,z){

    return (
        Math.sin(x * 0.055) * 0.75 +
        Math.cos(z * 0.065) * 0.65 +
        Math.sin((x + z) * 0.035) * 0.35
    );
}

/* =========================================================
   TERRAIN
========================================================= */

function createTerrain(){

    const width=130;
    const depth=110;

    const segmentsX=120;
    const segmentsZ=120;


    const geometry =
        new THREE.PlaneGeometry(
            width,
            depth,
            segmentsX,
            segmentsZ
        );


    const position =
        geometry.attributes.position;


    /*
       PlaneGeometry starts in XY.

       We store terrain height in Z,
       then rotate the entire plane.

       This means:
       X -> world X
       Y -> world Z
       Z -> world Y
    */

    for(
        let i=0;
        i<position.count;
        i++
    ){

        const x =
            position.getX(i);

        const z =
            position.getY(i);


        position.setZ(
            i,
            terrainHeight(x,z)
        );
    }


    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({
            color:0x4f914b,
            roughness:1,
            metalness:0
        });


    const ground =
        new THREE.Mesh(
            geometry,
            material
        );


    ground.rotation.x =
        -Math.PI/2;


    ground.receiveShadow=true;

    scene.add(ground);
}

    scene.add(road);
}

/* =========================================================
   TREES
========================================================= */

function createTree(x,z){

    const group =
        new THREE.Group();


    group.position.set(
        x,
        terrainHeight(x,z),
        z
    );


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .32,
                .5,
                3.8,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x633e23,
                roughness:1
            })
        );


    trunk.position.y=1.9;

    trunk.castShadow=true;

    group.add(trunk);


    const leafColors=[
        0x164d2d,
        0x1e6734,
        0x2b7e3c
    ];


    for(
        let i=0;
        i<3;
        i++
    ){

        const leaves =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    2.6-i*.3,
                    3.4,
                    10
                ),
                new THREE.MeshStandardMaterial({
                    color:leafColors[i],
                    roughness:1
                })
            );


        leaves.position.y=
            4+i*1.4;


        leaves.castShadow=true;

        group.add(leaves);
    }


    scene.add(group);


    obstacles.push({
        x:x,
        z:z,
        radius:1.7
    });
}


function createTrees(){

    let count=0;


    while(count<85){

        const x =
            (Math.random()-.5)*105;

        const z =
            (Math.random()-.5)*80;


        if(
            Math.abs(x)<12 &&
            Math.abs(z)<12
        ){

            continue;
        }


        let tooClose=false;


        locations.forEach(
            loc=>{

                const dx=x-loc.x;
                const dz=z-loc.z;


                if(
                    Math.sqrt(
                        dx*dx+dz*dz
                    )<10
                ){

                    tooClose=true;
                }
            }
        );


        if(tooClose)
            continue;


        createTree(x,z);

        count++;
    }
}

                    roughness:1

            );


        rock.position.set(
            x,
            terrainHeight(x,z)+size,
            z
        );


        rock.rotation.set(
            Math.random(),
            Math.random(),
            Math.random()
        );


        rock.castShadow=true;

        scene.add(rock);


        obstacles.push({
            x:x,
            z:z,
            radius:size*.8
        });
    }
}

/* =========================================================
   COLLISION
========================================================= */

function canMoveTo(x,z){

    const playerRadius=1.05;


    if(
        x<-53 ||
        x>53 ||
        z<-44 ||
        z>44
    ){

        return false;
    }


    for(
        let i=0;
        i<obstacles.length;
        i++
    ){

        const obstacle =
            obstacles[i];


        const dx =
            x-obstacle.x;

        const dz =
            z-obstacle.z;


        const distance =
            Math.sqrt(
                dx*dx+
                dz*dz
            );


        if(
            distance<
            playerRadius+
            obstacle.radius
        ){

            return false;
        }
    }


    return true;
}


/* =========================================================
   KEYBOARD
========================================================= */

function setupKeyboard(){

    window.addEventListener(
        "keydown",
        event=>{

            const key =
                event.key.toLowerCase();


            keys[key]=true;


            if(
                key==="e" &&
                nearby
            ){

                openLesson(nearby);
            }


            if(
                ["w","a","s","d"," "].includes(key)
            ){

                event.preventDefault();
            }
        }
    );


    window.addEventListener(
        "keyup",
        event=>{

            keys[
                event.key.toLowerCase()
            ]=false;
        }
    );
}


/* =========================================================
   MOUSE
========================================================= */

function setupMouse(){

    renderer.domElement.addEventListener(
        "click",
        ()=>{

            renderer
                .domElement
                .requestPointerLock();
        }
    );


    document.addEventListener(
        "mousemove",
        event=>{

            if(
                document.pointerLockElement !==
                renderer.domElement
            ){

                return;
            }


            yaw -=
                event.movementX*.0025;


            pitch -=
                event.movementY*.002;


            pitch =
                THREE.MathUtils.clamp(
                    pitch,
                    -.45,
                    .25
                );
        }
    );
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

    let forward=0;
    let strafe=0;


    /*
       W = FORWARD
       S = BACKWARD
       A = LEFT
       D = RIGHT
    */

    if(keys["w"])
        forward=1;

    if(keys["s"])
        forward=-1;

    if(keys["a"])
        strafe=-1;

    if(keys["d"])
        strafe=1;


    const moving =
        forward!==0 ||
        strafe!==0;


    if(moving){

        const length =
            Math.sqrt(
                forward*forward+
                strafe*strafe
            );


        forward/=length;
        strafe/=length;


        const speed =
            keys["shift"]
            ?0.30
            :0.15;


        /*
           Camera forward direction.
        */

        const forwardX =
            -Math.sin(yaw);

        const forwardZ =
            -Math.cos(yaw);


        /*
           Camera right direction.
        */

        const rightX =
            Math.cos(yaw);

        const rightZ =
            -Math.sin(yaw);


        const moveX =
            (
                forwardX*forward+
                rightX*strafe
            )*speed;


        const moveZ =
            (
                forwardZ*forward+
                rightZ*strafe
            )*speed;


        const nextX =
            player.position.x+
            moveX;


        const nextZ =
            player.position.z+
            moveZ;


        /*
           Collision on X.
        */

        if(
            canMoveTo(
                nextX,
                player.position.z
            )
        ){

            player.position.x=
                nextX;
        }


        /*
           Collision on Z.
        */

        if(
            canMoveTo(
                player.position.x,
                nextZ
            )
        ){

            player.position.z=
                nextZ;
        }


        /*
           VERY IMPORTANT:

           The player's feet are placed
           directly on the terrain.
        */

        player.position.y=
            terrainHeight(
                player.position.x,
                player.position.z
            );


        /*
           Face movement direction.
        */

        const targetRotation=
            Math.atan2(
                moveX,
                moveZ
            );


        player.rotation.y=
            THREE.MathUtils.lerp(
                player.rotation.y,
                targetRotation,
                .15
            );

    }else{

        /*
           Even when standing still,
           keep the player attached
           to the ground.
        */

        player.position.y=
            terrainHeight(
                player.position.x,
                player.position.z
            );
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const distance=10.5;


    const horizontal=
        Math.cos(pitch)*
        distance;


    const vertical=
        Math.sin(pitch)*
        distance;


    /*
       Camera stays behind player.
    */

    const desiredX=
        player.position.x+
        Math.sin(yaw)*
        horizontal;


    const desiredZ=
        player.position.z+
        Math.cos(yaw)*
        horizontal;


    let desiredY=
        player.position.y+
        4.5+
        vertical;


    /*
       Never allow camera to go
       underground.
    */

    const cameraGround=
        terrainHeight(
            desiredX,
            desiredZ
        );


    if(
        desiredY<
        cameraGround+2.5
    ){

        desiredY=
            cameraGround+2.5;
    }


    camera.position.lerp(
        new THREE.Vector3(
            desiredX,
            desiredY,
            desiredZ
        ),
        .10
    );


    camera.lookAt(
        player.position.x,
        player.position.y+2.0,
        player.position.z
    );
}


/* =========================================================
   NEARBY LOCATIONS
========================================================= */

function checkNearby(){

    nearby=null;

    let closest=999;


    locations.forEach(
        location=>{

            const dx=
                player.position.x-
                location.x;

            const dz=
                player.position.z-
                location.z;


            const distance=
                Math.sqrt(
                    dx*dx+
                    dz*dz
                );


            if(
                distance<11 &&
                distance<closest
            ){

                closest=distance;

                nearby=location;
            }
        }
    );


    const interact=
        document.getElementById(
            "interact"
        );


    if(nearby){

        interact.style.display=
            "block";


        interact.innerHTML=
            "🏛️ Press <b>E</b> to learn: "+
            nearby.name;

    }else{

        interact.style.display=
            "none";
    }
}


/* =========================================================
   LESSON SYSTEM
========================================================= */

function openLesson(location){

    document
        .getElementById("lesson")
        .style.display="flex";


    document
        .getElementById("lessonTitle")
        .textContent=
        location.title;


    document
        .getElementById("lessonIntro")
        .textContent=
        location.intro;


    document
        .getElementById("lessonContent")
        .innerHTML=
        location.lesson;


    document
        .getElementById("challenge")
        .textContent=
        location.challenge;
}


function closeLesson(){

    document
        .getElementById("lesson")
        .style.display=
        "none";
}


function finishLesson(){

    xp+=100;

    gems+=5;

    level=
        Math.floor(xp/300)+1;


    document
        .getElementById("xp")
        .textContent=xp;


    document
        .getElementById("gems")
        .textContent=gems;


    document
        .getElementById("level")
        .textContent=level;


    document
        .getElementById("questText")
        .textContent=
        "🎉 Lesson completed! Find another learning location.";


    closeLesson();
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect=
        innerWidth/
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight,
        false
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );
}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateCamera();

    checkNearby();


    const time=
        performance.now()/1000;


    animatedObjects.forEach(
        item=>{

            if(
                item.type==="crystal"
            ){

                item.object.rotation.y=
                    time*1.7;


                item.object.position.y=
                    13.8+
                    Math.sin(time*2.4)*.4;
            }


            if(
                item.type==="water"
            ){

                item.object.material.opacity=
                    .82+
                    Math.sin(time*1.4)*.04;
            }
        }
    );


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   LOADING
========================================================= */

let load=0;


const timer=
    setInterval(
        ()=>{

            load+=4;


            document
                .getElementById(
                    "progress"
                )
                .style.width=
                load+"%";


            if(load>=100){

                clearInterval(timer);

                startGame();
            }

        },
        25
    );

</script>
