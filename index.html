/* =========================================================
   TERRAIN HEIGHT FUNCTION
========================================================= */

function terrainHeight(x,z){

    return (
        Math.sin(x*.08)*1.2+
        Math.cos(z*.09)*1.0+
        Math.sin(x*.18+z*.13)*.35
    );
}


/* =========================================================
   START
========================================================= */

function startGame(){

    scene=
        new THREE.Scene();

    scene.background=
        new THREE.Color(0x82cbed);

    scene.fog=
        new THREE.Fog(
            0x82cbed,
            50,
            170
        );


    camera=
        new THREE.PerspectiveCamera(
            65,
            innerWidth/innerHeight,
            .1,
            500
        );


    renderer=
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type=
        THREE.PCFSoftShadowMap;


    document
        .getElementById("game")
        .appendChild(renderer.domElement);


    /* LIGHT */

    const hemisphere=
        new THREE.HemisphereLight(
            0xbfeaff,
            0x29421e,
            1.7
        );

    scene.add(hemisphere);


    const sun=
        new THREE.DirectionalLight(
            0xffedc8,
            2.3
        );

    sun.position.set(
        -60,
        100,
        40
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    sun.shadow.camera.left=-100;
    sun.shadow.camera.right=100;
    sun.shadow.camera.top=100;
    sun.shadow.camera.bottom=-100;

    scene.add(sun);


    createTerrain();

    createWater();

    createRoads();

    createMountains();

    createTrees();

    createRocks();

    createBuildings();

    createPlayer();

    setupControls();

    setupMouse();


    window.addEventListener(
        "resize",
        resize
    );


    setTimeout(()=>{
        document
            .getElementById("loading")
            .style.display="none";
    },1000);


    animate();
}


/* =========================================================
   TERRAIN
========================================================= */

function createTerrain(){

    const geometry=
        new THREE.PlaneGeometry(
            130,
            110,
            60,
            60
        );


    const positions=
        geometry.attributes.position;


    for(
        let i=0;
        i<positions.count;
        i++
    ){

        const x=
            positions.getX(i);

        const y=
            positions.getY(i);


        positions.setZ(
            i,
            terrainHeight(
                x,
                y
            )
        );
    }


    geometry.computeVertexNormals();


    const material=
        new THREE.MeshStandardMaterial({
            color:0x477f43,
            roughness:1
        });


    const terrain=
        new THREE.Mesh(
            geometry,
            material
        );


    terrain.rotation.x=
        -Math.PI/2;

    terrain.receiveShadow=true;

    scene.add(terrain);
}


/* =========================================================
   WATER
========================================================= */

function createWater(){

    const water=
        new THREE.Mesh(
            new THREE.CircleGeometry(
                15,
                48
            ),
            new THREE.MeshStandardMaterial({
                color:0x158fc0,
                roughness:.15,
                metalness:.15,
                transparent:true,
                opacity:.85
            })
        );

    water.rotation.x=
        -Math.PI/2;

    water.position.set(
        43,
        .1,
        -28
    );

    scene.add(water);
}


/* =========================================================
   ROADS
========================================================= */

function createRoad(
    x,z,
    width,length,
    rotation=0
){

    const road=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .12,
                length
            ),
            new THREE.MeshStandardMaterial({
                color:0x9b744f,
                roughness:1
            })
        );


    road.position.set(
        x,
        terrainHeight(x,z)+.05,
        z
    );


    road.rotation.y=
        rotation;

    road.receiveShadow=true;

    scene.add(road);
}


function createRoads(){

    createRoad(
        0,0,
        6,95
    );

    createRoad(
        0,0,
        6,100,
        Math.PI/2
    );

    createRoad(
        -15,-20,
        4,35,
        -.6
    );

    createRoad(
        15,-12,
        4,35,
        .8
    );
}


/* =========================================================

========================================================= */

                    loc.x,
                    loc.z

                groundY,
                loc.z
            );


            /* FOUNDATION */

            const foundation=
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        6,

                        .7,

                        roughness:.8

                );

            foundation.castShadow=true;

            group.add(foundation);

                        7,
                        5.5,
                        6

                    new THREE.MeshStandardMaterial({
                        color:

            wall.position.y=3.1;

            wall.castShadow=true;

            /* SECOND FLOOR */

                        4.8

                    new THREE.ConeGeometry(

                        4,

            roof.castShadow=true;

            group.add(roof);

                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.5,
                        2.7,
                        .25
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x25170e
                    })
                );


            door.position.set(
                0,
                1.35,
                3.1
            );

            group.add(door);


            /* WINDOWS */

            for(
                let side=-1;
                side<=1;
                side+=2
            ){

                const windowMesh=
                    new THREE.Mesh(
                        new THREE.BoxGeometry(
                            1.25,
                            1.25,
                            .18
                        ),
                        new THREE.MeshStandardMaterial({
                            color:0x72d9f5,
                            emissive:0x164c68,
                            emissiveIntensity:.7
                        })
                    );


                windowMesh.position.set(
                    side*2,
                    3.4,
                    3.08
                );

                group.add(windowMesh);
            }


            /* BALCONY */

            const balcony=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        5,
                        .25,
                        1.4
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x303b45
                    })
                );

            balcony.position.set(
                0,
                5.8,
                3.5
            );

            group.add(balcony);


            /* FLAG POLE */

            const pole=
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .08,
                        .08,
                        5,
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x303030
                    })
                );

            pole.position.y=13;

            group.add(pole);


            const flag=
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        2.2,
                        1.2
                    ),
                    new THREE.MeshBasicMaterial({
                        color:loc.color,

            crystal.userData.location=loc;

}


/* =========================================================
   TREES
========================================================= */

function createTree(x,z){

    const group=
        new THREE.Group();


    const y=
        terrainHeight(x,z);


    group.position.set(
        x,
        y,
        z
    );


    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .5,
                3.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x654326
            })
        );


    trunk.position.y=1.75;

    trunk.castShadow=true;

    group.add(trunk);


    for(
        let i=0;
        i<3;
        i++
    ){

        const leaves=
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    2.4-i*.35,
                    3.2,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:
                        i===0
                        ?0x195d34
                        :0x287a3d,
                    roughness:1
                })
            );


        leaves.position.y=
            4+i*1.7;

        leaves.castShadow=true;

        group.add(leaves);
    }


    scene.add(group);
}


function createTrees(){

    for(
        let i=0;
        i<100;
        i++
    ){

        const x=
            (Math.random()-.5)*110;

        const z=
            (Math.random()-.5)*85;


        if(
            Math.abs(x)<17 &&
            Math.abs(z)<17
        ) continue;


        createTree(
            x,
            z
        );
    }
}


/* =========================================================
   ROCKS
========================================================= */

function createRocks(){

    for(
        let i=0;
        i<40;
        i++
    ){

        const x=
            (Math.random()-.5)*110;

        const z=
            (Math.random()-.5)*85;


        const rock=
            new THREE.Mesh(
                new THREE.DodecahedronGeometry(
                    .4+
                    Math.random()*.8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x65727a,
                    roughness:1
                })
            );


        rock.position.set(
            x,
            terrainHeight(x,z)+.4,
            z
        );


        rock.rotation.set(
            Math.random(),
            Math.random(),
            Math.random()
        );


        rock.castShadow=true;

        scene.add(rock);
    }
}


/* =========================================================
   MOUNTAINS
========================================================= */

function createMountains(){

    const positions=[
        [-52,-45,13,28],
        [-30,-47,11,24],
        [0,-50,14,30],
        [30,-48,12,27],
        [52,-42,15,30]
    ];


    positions.forEach(
        p=>{

            const mountain=
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        p[2],
                        p[3],
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x53626b,
                        roughness:1
                    })
                );


            mountain.position.set(
                p[0],
                p[3]/2,
                p[1]
            );


            mountain.castShadow=true;

            scene.add(mountain);
        }
    );
}

        2.3,

    /* ground circle */

    const circle=
        new THREE.Mesh(
            new THREE.RingGeometry(
                1,
                1.1,
                32

            new THREE.MeshBasicMaterial({
                color:0x52dcff,
                side:THREE.DoubleSide
            })
        );

    circle.rotation.x=
        -Math.PI/2;

    circle.position.y=.03;

    player.add(circle);


    /* IMPORTANT:
       PLAYER STARTS ON TERRAIN
    */

    player.position.set(
        0,
        terrainHeight(0,10),
        10
    );


    scene.add(player);
}


/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=true;


            if(
                e.key.toLowerCase()==="e" &&
                nearby
            ){

                openLesson(
                    nearby
                );
            }
        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=false;
        }
    );
}


/* =========================================================
   MOUSE CAMERA
========================================================= */

function setupMouse(){

    renderer.domElement.addEventListener(
        "click",
        ()=>{

            renderer
                .domElement
                .requestPointerLock();
        }
    );


    document.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement
                !==renderer.domElement
            ) return;


            yaw-=
                e.movementX*.0025;


            pitch-=
                e.movementY*.0025;


            pitch=
                THREE.MathUtils.clamp(
                    pitch,
                    -.7,
                    .25
                );
        }
    );
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

    let forward=0;
    let side=0;


    if(keys["w"]) forward++;
    if(keys["s"]) forward--;

    if(keys["d"]) side++;
    if(keys["a"]) side--;


    if(
        forward===0 &&
        side===0
    ){

        /* STILL FOLLOW TERRAIN */

        player.position.y=
            terrainHeight(
                player.position.x,
                player.position.z
            );

        return;
    }


    const length=
        Math.sqrt(
            forward*forward+
            side*side
        );


    forward/=length;
    side/=length;


    const speed=
        keys["shift"]
        ?0.28
        :0.14;


    player.position.x+=
        (
            Math.sin(yaw)*forward+
            Math.cos(yaw)*side
        )*speed;


    player.position.z+=
        (
            Math.cos(yaw)*forward-
            Math.sin(yaw)*side
        )*speed;


    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -50,
            50
        );


    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -42,
            42
        );


    /* FOLLOW TERRAIN */

    player.position.y=
        terrainHeight(
            player.position.x,
            player.position.z
        );


    /* TURN CHARACTER */

    player.rotation.y=
        Math.atan2(
            Math.sin(yaw)*forward+
            Math.cos(yaw)*side,
            Math.cos(yaw)*forward-
            Math.sin(yaw)*side
        );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const distance=11;


    const horizontal=
        Math.cos(pitch)*distance;


    const vertical=
        Math.sin(pitch)*distance;


    const targetX=
        player.position.x-
        Math.sin(yaw)*horizontal;


    const targetY=
        player.position.y+
        5+
        vertical;


    const targetZ=
        player.position.z-
        Math.cos(yaw)*horizontal;


    camera.position.lerp(
        new THREE.Vector3(
            targetX,
            targetY,
            targetZ
        ),
        .08
    );


    camera.lookAt(
        player.position.x,
        player.position.y+2,
        player.position.z
    );
}


/* =========================================================
   FIND LOCATION
========================================================= */

function checkNearby(){

    nearby=null;

    let nearest=999;


    locations.forEach(
        loc=>{

            const dx=
                player.position.x-
                loc.x;

            const dz=
                player.position.z-
                loc.z;


            const distance=
                Math.sqrt(
                    dx*dx+
                    dz*dz
                );


            if(
                distance<10 &&
                distance<nearest
            ){

                nearest=distance;

                nearby=loc;
            }
        }
    );


    const interaction=
        document.getElementById(
            "interact"
        );


    if(nearby){

        interaction.style.display=
            "block";

        interaction.innerHTML=
            "🏛️ Press <b>E</b> to learn: "+
            nearby.name;

    }else{

        interaction.style.display=
            "none";
    }
}


/* =========================================================
   LESSON SYSTEM
========================================================= */

function openLesson(loc){

    document
        .getElementById("lesson")
        .style.display="flex";


    document
        .getElementById("lessonTitle")
        .textContent=
        loc.title;


    document
        .getElementById("lessonIntro")
        .textContent=
        loc.intro;


    document
        .getElementById("lessonContent")
        .innerHTML=
        loc.lesson;


    document
        .getElementById("challenge")
        .textContent=
        loc.challenge;
}


function closeLesson(){

    document
        .getElementById("lesson")
        .style.display="none";
}


function finishLesson(){

    xp+=100;

    gems+=5;

    level=
        Math.floor(xp/300)+1;


    document
        .getElementById("xp")
        .textContent=
        xp;


    document
        .getElementById("gems")
        .textContent=
        gems;


    document
        .getElementById("level")
        .textContent=
        level;


    document
        .getElementById("questText")
        .textContent=
        "🎉 Skill completed! Explore the kingdom for another challenge.";


    closeLesson();
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateCamera();

    checkNearby();


    const time=
        performance.now()*.001;


    scene.traverse(
        object=>{

            if(
                object.geometry &&
                object.geometry.type===
                "OctahedronGeometry"
            ){

                object.rotation.y=
                    time;

                object.position.y=
                    15+
                    Math.sin(time*2)*.5;
            }
        }
    );


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   LOADING
========================================================= */

let progress=0;

const loadingTimer=
    setInterval(
        ()=>{

            progress+=5;


            document
                .getElementById(
                    "loadingProgress"
                )
                .style.width=
                progress+"%";


            if(progress>=100){

                clearInterval(
                    loadingTimer
                );

                startGame();
            }

        },
        30
    );

</script>

</body>
