<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillShareJR — Kingdom of Skills</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050b18;
    font-family:Arial, sans-serif;
    color:white;
}

canvas{
    display:block;
}

/* ---------------- UI ---------------- */

#logo{
    position:fixed;
    top:22px;
    left:25px;
    padding:18px 25px;
    border:1px solid #38bdf8;
    border-radius:22px;
    background:rgba(3,12,30,.82);
    backdrop-filter:blur(12px);
    box-shadow:0 0 30px rgba(0,170,255,.25);
    z-index:10;
}

#logo h1{
    font-size:27px;
    color:#5bd8ff;
    letter-spacing:1px;
}

#logo p{
    margin-top:5px;
    color:#b9d9f5;
    font-size:13px;
}

#stats{
    position:fixed;
    top:22px;
    right:25px;
    width:190px;
    padding:18px;
    border:1px solid #eabf48;
    border-radius:22px;
    background:rgba(3,12,30,.84);
    backdrop-filter:blur(12px);
    box-shadow:0 0 30px rgba(255,190,50,.15);
    z-index:10;
}

.stat{
    margin:8px 0;
    font-size:15px;
}

.stat strong{
    display:block;
    font-size:22px;
    color:white;
}

#quest{
    position:fixed;
    left:25px;
    bottom:25px;
    width:370px;
    padding:20px;
    border-radius:22px;
    background:rgba(5,12,30,.88);
    border:1px solid #9b5cff;
    box-shadow:0 0 35px rgba(140,70,255,.2);
    z-index:10;
}

#questTitle{
    color:#d4a7ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:8px;
}

#questText{
    font-size:17px;
    line-height:1.4;
}

#controls{
    position:fixed;
    right:25px;
    bottom:25px;
    padding:15px 20px;
    border:1px solid #2875a5;
    border-radius:18px;
    background:rgba(3,12,30,.8);
    color:#cbe8ff;
    z-index:10;
}

#message{
    position:fixed;
    left:50%;
    top:80px;
    transform:translateX(-50%);
    padding:15px 25px;
    border-radius:30px;
    background:rgba(5,20,45,.9);
    border:1px solid #5bd8ff;
    box-shadow:0 0 25px rgba(0,190,255,.3);
    opacity:0;
    transition:.4s;
    z-index:20;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:8px;
    height:8px;
    border:1px solid white;
    border-radius:50%;
    opacity:.7;
    transform:translate(-50%,-50%);
    z-index:5;
}

#loading{
    position:fixed;
    inset:0;
    background:#030817;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

#loading h1{
    color:#55d9ff;
    font-size:42px;
    margin-bottom:15px;
}

#bar{
    width:300px;
    height:7px;
    background:#18283e;
    border-radius:20px;
    overflow:hidden;
}

#progress{
    height:100%;
    width:0%;
    background:#48d8ff;
    box-shadow:0 0 15px #48d8ff;
}

#hint{
    margin-top:15px;
    color:#8ca6bd;
}
</style>
</head>

<body>

<div id="loading">
    <h1>SKILLSHAREJR</h1>
    <div id="bar">
        <div id="progress"></div>
    </div>
    <div id="hint">Entering the Kingdom of Skills...</div>
</div>

<div id="logo">
    <h1>⚔ SKILLSHAREJR</h1>
    <p>MASTER LIFE SKILLS • BUILD YOUR KINGDOM</p>
</div>

<div id="stats">
    <div class="stat">
        ⭐ EXPERIENCE
        <strong id="xp">0 XP</strong>
    </div>

    <div class="stat">
        💎 GEMS
        <strong id="gems">10</strong>
    </div>

    <div class="stat">
        🏆 LEVEL
        <strong id="level">1</strong>
    </div>
</div>

<div id="quest">
    <div id="questTitle">📜 CURRENT QUEST</div>
    <div id="questText">
        Explore the kingdom and discover your first life skill.
    </div>
</div>

<div id="controls">
    🎮 <b>W A S D</b> — Move<br>
    🖱️ <b>Mouse</b> — Look around<br>
    🏰 <b>Click buildings</b> — Learn
</div>

<div id="message"></div>
<div id="crosshair"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x07152b);

scene.fog = new THREE.FogExp2(
    0x07152b,
    0.009
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    1000
);

camera.position.set(
    0,
    8,
    18
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0x8cc8ff,
        0x101522,
        2
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffe5bd,
        4
    );

sun.position.set(
    -80,
    100,
    40
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =========================================================
   GLOWING MOON
========================================================= */

const moonGeo =
    new THREE.SphereGeometry(5,32,32);

const moonMat =
    new THREE.MeshBasicMaterial({
        color:0xbbe9ff
    });

const moon =
    new THREE.Mesh(
        moonGeo,
        moonMat
    );

moon.position.set(
    -80,
    75,
    -100
);

scene.add(moon);


/* =========================================================
   WORLD GROUND
========================================================= */

const groundGeo =
    new THREE.PlaneGeometry(
        220,
        220,
        60,
        60
    );

const groundMat =
    new THREE.MeshStandardMaterial({
        color:0x183c32,
        roughness:.95
    });

const ground =
    new THREE.Mesh(
        groundGeo,
        groundMat
    );

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   WATER
========================================================= */

const waterGeo =
    new THREE.PlaneGeometry(
        35,
        220
    );

const waterMat =
    new THREE.MeshPhysicalMaterial({
        color:0x0877ad,
        transparent:true,
        opacity:.75,
        roughness:.15,
        metalness:.1
    });

const water =
    new THREE.Mesh(
        waterGeo,
        waterMat
    );

water.rotation.x = -Math.PI/2;
water.position.set(30,.08,0);

scene.add(water);


/* =========================================================
   MOUNTAINS
========================================================= */

function createMountain(x,z,s){

    const geo =
        new THREE.ConeGeometry(
            s,
            s*2.2,
            8
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:0x344c5e,
            roughness:1
        });

    const mountain =
        new THREE.Mesh(
            geo,
            mat
        );

    mountain.position.set(
        x,
        s,
        z
    );

    mountain.castShadow = true;

    scene.add(mountain);
}


for(let i=0;i<35;i++){

    const side =
        i%2===0 ? -1 : 1;

    createMountain(
        side*(55+Math.random()*35),
        -70+Math.random()*140,
        8+Math.random()*14
    );
}


/* =========================================================
   TREES
========================================================= */

function createTree(x,z){

    const tree =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .45,.65,3,8
            ),
            new THREE.MeshStandardMaterial({
                color:0x5b3825
            })
        );

    trunk.position.y=1.5;

    trunk.castShadow=true;

    tree.add(trunk);


    for(let i=0;i<3;i++){

        const crown =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    2.8-i*.45,
                    4,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:
                    i===0 ?
                    0x123f2c :
                    0x1d6842
                })
            );

        crown.position.y =
            3.5+i*1.6;

        crown.castShadow=true;

        tree.add(crown);
    }

    tree.position.set(x,0,z);

    scene.add(tree);
}


for(let i=0;i<120;i++){

    let x,z;

    do{
        x=(Math.random()-.5)*190;
        z=(Math.random()-.5)*190;
    }
    while(
        Math.abs(x)<35 &&
        Math.abs(z)<35
    );

    createTree(x,z);
}


/* =========================================================
   CRYSTALS
========================================================= */

function createCrystal(x,y,z,color){

    const geo =
        new THREE.OctahedronGeometry(
            1.2,
            0
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:color,
            emissive:color,
            emissiveIntensity:2,
            roughness:.2
        });

    const crystal =
        new THREE.Mesh(
            geo,
            mat
        );

    crystal.position.set(
        x,y,z
    );

    crystal.rotation.z =
        Math.random();

    scene.add(crystal);

    return crystal;
}


const crystals=[];

for(let i=0;i<25;i++){

    crystals.push(
        createCrystal(
            (Math.random()-.5)*150,
            1+Math.random()*2,
            (Math.random()-.5)*150,
            Math.random()>0.5
            ?0x38d9ff
            :0x9c4dff
        )
    );
}


/* =========================================================
   CASTLE
========================================================= */

function createTower(x,z){

    const group =
        new THREE.Group();

    const tower =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                4,4,18,16
            ),
            new THREE.MeshStandardMaterial({
                color:0x566477,
                roughness:.7
            })
        );

    tower.position.y=9;

    tower.castShadow=true;

    group.add(tower);


    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                5.5,
                8,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x283f75
            })
        );

    roof.position.y=22;

    roof.castShadow=true;

    group.add(roof);


    const windowMat =
        new THREE.MeshStandardMaterial({
            color:0x55d9ff,
            emissive:0x55d9ff,
            emissiveIntensity:2
        });


    for(let i=0;i<4;i++){

        const window =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .8,1.7,.2
                ),
                windowMat
            );

        window.position.set(
            0,
            9+i*2.5,
            3.9
        );

        group.add(window);
    }


    group.position.set(x,0,z);

    scene.add(group);
}


createTower(-16,-45);
createTower(16,-45);
createTower(-30,-45);
createTower(30,-45);


/* Castle main building */

const castle =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            55,22,15
        ),
        new THREE.MeshStandardMaterial({
            color:0x687789
        })
    );

castle.position.set(
    0,11,-45
);

castle.castShadow=true;

scene.add(castle);


/* Castle roof */

const roof =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            32,
            15,
            4
        ),
        new THREE.MeshStandardMaterial({
            color:0x314d8b
        })
    );

roof.rotation.y=Math.PI/4;

roof.position.set(
    0,29,-45
);

roof.castShadow=true;

scene.add(roof);


/* =========================================================
   BUILDINGS / LIFE SKILLS
========================================================= */

const buildings=[];


function createBuilding(
    x,
    z,
    color,
    name,
    skill
){

    const group =
        new THREE.Group();

    const base =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                12,7,10
            ),
            new THREE.MeshStandardMaterial({
                color:0x765d4b
            })
        );

    base.position.y=3.5;

    base.castShadow=true;

    group.add(base);


    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                9,
                6,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:color
            })
        );

    roof.rotation.y=Math.PI/4;

    roof.position.y=10;

    roof.castShadow=true;

    group.add(roof);


    const sign =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                8,.9,.3
            ),
            new THREE.MeshStandardMaterial({
                color:0x07152b,
                emissive:color,
                emissiveIntensity:1
            })
        );

    sign.position.set(
        0,
        7,
        5.15
    );

    group.add(sign);


    group.position.set(
        x,0,z
    );

    scene.add(group);

    buildings.push({
        object:group,
        name:name,
        skill:skill
    });
}


/* Skill districts */

createBuilding(
    -25,
    -5,
    0x41d98b,
    "LIFE KITCHEN",
    "Cooking & Nutrition"
);

createBuilding(
    25,
    -5,
    0x38bdf8,
    "WISE BANK",
    "Money Management"
);

createBuilding(
    -25,
    25,
    0xff9f43,
    "HOME HUB",
    "Household Skills"
);

createBuilding(
    25,
    25,
    0xd65cff,
    "COMMUNICATION TOWER",
    "Communication"
);


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Group();

scene.add(player);


/* body */

const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .8,
            1.8,
            8,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0x2468c9,
            roughness:.55
        })
    );

body.position.y=2;

body.castShadow=true;

player.add(body);


/* head */

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .75,
            24,
            24
        ),
        new THREE.MeshStandardMaterial({
            color:0xf2c7a5
        })
    );

head.position.y=3.6;

head.castShadow=true;

player.add(head);


/* hair */

const hair =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .78,
            16,
            16,
            0,
            Math.PI*2,
            0,
            Math.PI*.55
        ),
        new THREE.MeshStandardMaterial({
            color:0x24170f
        })
    );

hair.position.y=3.95;

player.add(hair);


/* cloak */

const cloak =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            1.4,
            2.7,
            8,
            1,
            true
        ),
        new THREE.MeshStandardMaterial({
            color:0x172d68,
            side:THREE.DoubleSide
        })
    );

cloak.position.y=1.7;

cloak.rotation.x=Math.PI;

player.add(cloak);


/* =========================================================
   OWL COMPANION
========================================================= */

const owl =
    new THREE.Group();

const owlBody =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .75,20,20
        ),
        new THREE.MeshStandardMaterial({
            color:0x68452c
        })
    );

owlBody.position.y=1;

owl.add(owlBody);


const eyeMat =
    new THREE.MeshStandardMaterial({
        color:0xffe44c,
        emissive:0xffc400,
        emissiveIntensity:1
    });


for(const x of [-.25,.25]){

    const eye =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .2,12,12
            ),
            eyeMat
        );

    eye.position.set(
        x,
        1.15,
        .62
    );

    owl.add(eye);
}


owl.position.set(
    3,
    3,
    3
);

scene.add(owl);


/* =========================================================
   PARTICLE MAGIC
========================================================= */

const particleGeometry =
    new THREE.BufferGeometry();

const particleCount=1000;

const positions =
    new Float32Array(
        particleCount*3
    );

for(let i=0;i<particleCount;i++){

    positions[i*3] =
        (Math.random()-.5)*180;

    positions[i*3+1] =
        Math.random()*35;

    positions[i*3+2] =
        (Math.random()-.5)*180;
}

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({
        color:0x66d9ff,
        size:.12,
        transparent:true,
        opacity:.8
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);


/* =========================================================
   KEYBOARD
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


/* =========================================================
   CAMERA
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping=true;

controls.enablePan=false;

controls.minDistance=7;
controls.maxDistance=22;

controls.maxPolarAngle=
    Math.PI*.48;

controls.target.set(
    0,2,0
);


/* =========================================================
   GAME VARIABLES
========================================================= */

let xp=0;
let gems=10;
let level=1;

const playerSpeed=.18;

let moving=false;


/* =========================================================
   QUEST SYSTEM
========================================================= */

let questComplete=false;

function addXP(amount){

    xp+=amount;

    if(xp>=100){

        level++;

        xp=0;

        showMessage(
            "🏆 LEVEL UP! You reached Level "+level
        );
    }

    document.getElementById(
        "xp"
    ).textContent=xp+" XP";

    document.getElementById(
        "level"
    ).textContent=level;
}


function showMessage(text){

    const box=
        document.getElementById(
            "message"
        );

    box.textContent=text;

    box.style.opacity=1;

    setTimeout(()=>{
        box.style.opacity=0;
    },3000);
}


/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(){

    moving=false;

    if(keys["w"]){

        player.position.z-=playerSpeed;
        moving=true;
    }

    if(keys["s"]){

        player.position.z+=playerSpeed;
        moving=true;
    }

    if(keys["a"]){

        player.position.x-=playerSpeed;
        moving=true;
    }

    if(keys["d"]){

        player.position.x+=playerSpeed;
        moving=true;
    }


    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -90,
            90
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -90,
            90
        );


    if(moving){

        body.position.y=
            2+
            Math.sin(
                performance.now()*.015
            )*.12;
    }


    controls.target.lerp(
        new THREE.Vector3(
            player.position.x,
            player.position.y+2,
            player.position.z
        ),
        .08
    );
}


/* =========================================================
   BUILDING INTERACTION
========================================================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


window.addEventListener(
    "click",
    event=>{

        mouse.x=
            (event.clientX/
            innerWidth)*2-1;

        mouse.y=
            -(event.clientY/
            innerHeight)*2+1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const objects=[];

        buildings.forEach(
            b=>{
                b.object.traverse(
                    child=>{
                        if(child.isMesh)
                            objects.push({
                                mesh:child,
                                data:b
                            });
                    }
                );
            }
        );

        const hits=
            raycaster.intersectObjects(
                objects.map(o=>o.mesh)
            );

        if(hits.length){

            const found=
                objects.find(
                    o=>o.mesh===hits[0].object
                );

            if(found){

                addXP(20);

                gems+=2;

                document.getElementById(
                    "gems"
                ).textContent=gems;

                document.getElementById(
                    "questText"
                ).textContent=
                    "🎉 You discovered "+
                    found.data.skill+
                    "! +20 XP";

                showMessage(
                    "✨ "+found.data.name+
                    " discovered! +20 XP"
                );
            }
        }
    }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock=
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const t=
        clock.getElapsedTime();


    updatePlayer();


    /* owl follows player */

    owl.position.x=
        player.position.x+3;

    owl.position.z=
        player.position.z+3;

    owl.position.y=
        3+
        Math.sin(t*3)*.3;

    owl.rotation.y=
        Math.sin(t)*.2;


    /* crystals float */

    crystals.forEach(
        (crystal,i)=>{

            crystal.rotation.y+=.01;

            crystal.position.y=
                1.5+
                Math.sin(
                    t*2+i
                )*.4;
        }
    );


    /* magical particles */

    particles.rotation.y=
        t*.01;


    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{
        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================================
   LOADING SCREEN
========================================================= */

let load=0;

const loadingInterval=
    setInterval(()=>{

        load+=5;

        document.getElementById(
            "progress"
        ).style.width=
            load+"%";

        if(load>=100){

            clearInterval(
                loadingInterval
            );

            setTimeout(()=>{

                document.getElementById(
                    "loading"
                ).style.display="none";

                showMessage(
                    "🦉 Welcome to the Kingdom of Skills!"
                );

            },500);
        }

    },40);


/* START */

player.position.set(
    0,0,5
);

animate();

</script>

</body>
