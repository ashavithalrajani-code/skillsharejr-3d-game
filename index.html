<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillShareJR - Kingdom of Skills</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#06101f;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* =========================
   LOADING SCREEN
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    background:
        radial-gradient(circle at 50% 40%,#12325b 0%,#06101f 55%,#020713 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    transition:opacity 1s;
}

#loading h1{
    font-size:58px;
    letter-spacing:4px;
    color:#55d9ff;
    text-shadow:
        0 0 10px #27bfff,
        0 0 30px #167cff;
    margin-bottom:20px;
}

.loading-sub{
    font-size:18px;
    color:#b8d9ff;
    margin-bottom:25px;
}

.loading-bar{
    width:400px;
    max-width:80vw;
    height:12px;
    border-radius:20px;
    background:#172b45;
    overflow:hidden;
}

#loading-progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#2cc8ff,#8b5cff,#ff5ce1);
    box-shadow:0 0 20px #4bc9ff;
    transition:width .2s;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
    color:white;
}

/* LOGO */

.logo{
    position:absolute;
    top:24px;
    left:24px;
    padding:16px 22px;
    border:1px solid rgba(74,196,255,.7);
    border-radius:20px;
    background:rgba(3,16,35,.78);
    backdrop-filter:blur(10px);
    box-shadow:
        0 0 30px rgba(0,162,255,.15),
        inset 0 0 20px rgba(0,100,255,.08);
}

.logo-title{
    font-size:27px;
    font-weight:900;
    letter-spacing:1px;
    color:#5bddff;
}

.logo-sub{
    font-size:12px;
    margin-top:5px;
    color:#b9d7ef;
    letter-spacing:1px;
}

/* STATS */

.stats{
    position:absolute;
    right:24px;
    top:24px;
    width:220px;
    padding:18px;
    border-radius:20px;
    background:rgba(3,16,35,.82);
    border:1px solid rgba(255,211,67,.7);
    box-shadow:0 0 30px rgba(255,194,50,.1);
}

.stat{
    margin-bottom:13px;
}

.stat:last-child{
    margin-bottom:0;
}

.stat-label{
    font-size:12px;
    color:#a9c3dc;
    text-transform:uppercase;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
    margin-top:2px;
}

.xp-bar{
    width:100%;
    height:6px;
    background:#182a42;
    border-radius:10px;
    overflow:hidden;
    margin-top:5px;
}

#xp-fill{
    height:100%;
    width:15%;
    background:linear-gradient(90deg,#ffd447,#ff8b2e);
    box-shadow:0 0 10px #ffb52d;
}

/* QUEST */

.quest{
    position:absolute;
    left:24px;
    bottom:24px;
    width:360px;
    padding:18px;
    border-radius:20px;
    background:rgba(4,17,37,.84);
    border:1px solid rgba(171,113,255,.8);
    box-shadow:0 0 35px rgba(127,67,255,.12);
}

.quest-title{
    color:#d5a8ff;
    font-size:13px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:9px;
}

.quest-text{
    font-size:16px;
    line-height:1.4;
}

.quest-progress{
    margin-top:12px;
    height:7px;
    background:#18283f;
    border-radius:10px;
    overflow:hidden;
}

.quest-progress div{
    height:100%;
    width:15%;
    background:linear-gradient(90deg,#9d5cff,#45c9ff);
}

/* CONTROLS */

.controls{
    position:absolute;
    right:24px;
    bottom:24px;
    padding:16px 20px;
    border-radius:18px;
    background:rgba(3,16,35,.78);
    border:1px solid rgba(68,190,255,.4);
    color:#cfe7ff;
    font-size:13px;
    line-height:1.8;
    text-align:right;
}

.controls strong{
    color:#fff;
}

/* LOCATION POPUP */

#location{
    position:absolute;
    left:50%;
    top:24px;
    transform:translateX(-50%);
    padding:10px 20px;
    border-radius:30px;
    background:rgba(5,19,40,.72);
    border:1px solid rgba(75,203,255,.5);
    color:#bfe9ff;
    opacity:0;
    transition:.4s;
}

/* MOBILE */

#mobile-controls{
    display:none;
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    pointer-events:auto;
}

.mobile-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    border:1px solid #5acfff;
    background:rgba(5,30,55,.8);
    color:white;
    font-size:20px;
    margin:4px;
}

@media(max-width:700px){

    .logo{
        top:10px;
        left:10px;
        padding:10px 14px;
    }

    .logo-title{
        font-size:19px;
    }

    .stats{
        top:10px;
        right:10px;
        width:145px;
        padding:10px;
    }

    .stat-value{
        font-size:16px;
    }

    .quest{
        left:10px;
        bottom:10px;
        width:calc(100% - 20px);
    }

    .controls{
        display:none;
    }

    #mobile-controls{
        display:block;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- =========================
     LOADING
========================= -->

<div id="loading">
    <h1>SKILLSHAREJR</h1>
    <div class="loading-sub">Entering the Kingdom of Skills...</div>
    <div class="loading-bar">
        <div id="loading-progress"></div>
    </div>
</div>

<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="logo">
        <div class="logo-title">⚔ SKILLSHAREJR</div>
        <div class="logo-sub">MASTER LIFE SKILLS • BUILD YOUR KINGDOM</div>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-label">⭐ Experience</div>
            <div class="stat-value"><span id="xp">0</span> XP</div>

            <div class="xp-bar">
                <div id="xp-fill"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">💎 Gems</div>
            <div class="stat-value" id="gems">10</div>
        </div>

        <div class="stat">
            <div class="stat-label">🏆 Level</div>
            <div class="stat-value" id="level">1</div>
        </div>

    </div>

    <div id="location">
        Kingdom of Skills
    </div>

    <div class="quest">
        <div class="quest-title">📜 Current Quest</div>

        <div class="quest-text" id="questText">
            Explore the kingdom and discover your first life skill.
        </div>

        <div class="quest-progress">
            <div id="questProgress"></div>
        </div>
    </div>

    <div class="controls">
        <strong>W A S D</strong> — Move<br>
        <strong>Mouse</strong> — Look around<br>
        <strong>Shift</strong> — Run<br>
        <strong>Space</strong> — Jump
    </div>

    <div id="mobile-controls">
        <button class="mobile-btn" data-key="w">▲</button><br>
        <button class="mobile-btn" data-key="a">◀</button>
        <button class="mobile-btn" data-key="s">▼</button>
        <button class="mobile-btn" data-key="d">▶</button>
    </div>

</div>

<!-- THREE.JS -->

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* =========================================
   BASIC SETUP
========================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x08182d);

scene.fog = new THREE.FogExp2(
    0x08182d,
    0.006
);

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(
    0,
    10,
    18
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================
   LOADING BAR
========================================= */

let loading = 0;

const loadingTimer = setInterval(()=>{

    loading += 4;

    document.getElementById(
        "loading-progress"
    ).style.width = loading + "%";

    if(loading >= 100){

        clearInterval(loadingTimer);

        setTimeout(()=>{

            document
                .getElementById("loading")
                .style.opacity = "0";

            setTimeout(()=>{

                document
                    .getElementById("loading")
                    .remove();

            },1000);

        },400);
    }

},60);


/* =========================================
   LIGHTING
========================================= */

const hemiLight =
    new THREE.HemisphereLight(
        0x9bdcff,
        0x18301e,
        2.2
    );

scene.add(hemiLight);


const sun =
    new THREE.DirectionalLight(
        0xffe6b0,
        4
    );

sun.position.set(
    -40,
    70,
    -30
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =========================================
   WORLD
========================================= */

const world = new THREE.Group();

scene.add(world);


/* =========================================
   GROUND
========================================= */

const groundGeometry =
    new THREE.CircleGeometry(
        80,
        64
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x244b35,
        roughness:.9
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

world.add(ground);


/* =========================================
   WATER
========================================= */

const waterGeometry =
    new THREE.CircleGeometry(
        120,
        64
    );

const waterMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0x087ea5,

        transparent:true,

        opacity:.72,

        roughness:.12,

        metalness:.1,

        transmission:.1

    });

const water =
    new THREE.Mesh(
        waterGeometry,
        waterMaterial
    );

water.rotation.x =
    -Math.PI / 2;

water.position.y = -0.45;

world.add(water);


/* =========================================
   MOUNTAINS
========================================= */

function createMountain(
    x,
    z,
    scale,
    color
){

    const geometry =
        new THREE.ConeGeometry(
            8 * scale,
            18 * scale,
            7
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.95
        });

    const mountain =
        new THREE.Mesh(
            geometry,
            material
        );

    mountain.position.set(
        x,
        7 * scale,
        z
    );

    mountain.castShadow = true;
    mountain.receiveShadow = true;

    world.add(mountain);

    /* Snow */

    const snowGeometry =
        new THREE.ConeGeometry(
            3.2 * scale,
            6 * scale,
            7
        );

    const snowMaterial =
        new THREE.MeshStandardMaterial({
            color:0xe9f5ff,
            roughness:1
        });

    const snow =
        new THREE.Mesh(
            snowGeometry,
            snowMaterial
        );

    snow.position.set(
        x,
        15 * scale,
        z
    );

    snow.castShadow = true;

    world.add(snow);
}


/* distant mountain range */

createMountain(
    -35,-45,2.2,0x354d62
);

createMountain(
    -15,-52,2.7,0x30485c
);

createMountain(
    12,-50,2.5,0x3b5265
);

createMountain(
    40,-43,2.2,0x344b5c
);


/* =========================================
   TREES
========================================= */

function createTree(x,z,s=1){

    const tree =
        new THREE.Group();

    /* trunk */

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .35*s,
                .55*s,
                3*s,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x68452b
            })

        );

    trunk.position.y =
        1.5*s;

    trunk.castShadow = true;

    tree.add(trunk);


    /* leaves */

    for(let i=0;i<3;i++){

        const leaves =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    (2.3-i*.35)*s,
                    3.2*s,
                    8
                ),

                new THREE.MeshStandardMaterial({
                    color:
                        i===0
                        ? 0x17663c
                        : 0x23844d
                })

            );

        leaves.position.y =
            (3+i*1.7)*s;

        leaves.castShadow = true;

        tree.add(leaves);
    }

    tree.position.set(x,0,z);

    world.add(tree);
}


/* forest */

for(let i=0;i<80;i++){

    const angle =
        Math.random()*Math.PI*2;

    const radius =
        25 + Math.random()*45;

    createTree(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius,
        .7+Math.random()*.8
    );
}


/* =========================================
   CRYSTALS
========================================= */

function createCrystal(x,z,color){

    const group =
        new THREE.Group();

    const geometry =
        new THREE.OctahedronGeometry(
            1.1,
            0
        );

    const material =
        new THREE.MeshStandardMaterial({

            color:color,

            emissive:color,

            emissiveIntensity:1.5,

            metalness:.3,

            roughness:.2

        });

    const crystal =
        new THREE.Mesh(
            geometry,
            material
        );

    crystal.position.y = 1.1;

    crystal.scale.y = 1.7;

    crystal.castShadow = true;

    group.add(crystal);

    group.position.set(
        x,
        0,
        z
    );

    world.add(group);

    return group;
}

const crystals=[];

crystals.push(
    createCrystal(-10,-8,0x43d9ff)
);

crystals.push(
    createCrystal(12,-12,0xa65cff)
);

crystals.push(
    createCrystal(18,8,0x55eaff)
);


/* =========================================
   CASTLE
========================================= */

function createTower(x,z){

    const tower =
        new THREE.Group();

    const body =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                2.4,
                2.7,
                9,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0x9ba7bd,
                roughness:.8
            })

        );

    body.position.y=4.5;

    body.castShadow=true;

    tower.add(body);


    const roof =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                3.2,
                4.5,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0x263c85,
                metalness:.2,
                roughness:.5
            })

        );

    roof.position.y=11;

    roof.castShadow=true;

    tower.add(roof);


    /* glowing window */

    const windowMat =
        new THREE.MeshStandardMaterial({

            color:0x6edcff,

            emissive:0x21bfff,

            emissiveIntensity:2

        });

    const win =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .7,
                1.5,
                .2
            ),

            windowMat

        );

    win.position.set(
        0,
        5,
        -2.35
    );

    tower.add(win);

    tower.position.set(
        x,
        0,
        z
    );

    world.add(tower);
}


/* castle towers */

createTower(-14,-22);
createTower(14,-22);
createTower(-14,-37);
createTower(14,-37);


/* castle main building */

const castle =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            22,
            12,
            15
        ),

        new THREE.MeshStandardMaterial({
            color:0x8f9caf,
            roughness:.8
        })

    );

castle.position.set(
    0,
    6,
    -30
);

castle.castShadow=true;

world.add(castle);


/* castle roof */

const castleRoof =
    new THREE.Mesh(

        new THREE.ConeGeometry(
            15,
            9,
            4
        ),

        new THREE.MeshStandardMaterial({
            color:0x263f91,
            roughness:.6
        })

    );

castleRoof.position.set(
    0,
    16,
    -30
);

castleRoof.rotation.y =
    Math.PI/4;

castleRoof.castShadow=true;

world.add(castleRoof);


/* castle door */

const door =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            3,
            5,
            .5
        ),

        new THREE.MeshStandardMaterial({
            color:0x24180f,
            roughness:.7
        })

    );

door.position.set(
    0,
    2.5,
    -37.7
);

world.add(door);


/* =========================================
   HOUSES
========================================= */

function createHouse(x,z,color){

    const house =
        new THREE.Group();

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                6,
                4.5,
                5
            ),

            new THREE.MeshStandardMaterial({
                color:0xd2b48c
            })

        );

    body.position.y=2.25;

    body.castShadow=true;

    house.add(body);


    const roof =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                4.7,
                4,
                4
            ),

            new THREE.MeshStandardMaterial({
                color:color
            })

        );

    roof.position.y=6.5;

    roof.rotation.y =
        Math.PI/4;

    roof.castShadow=true;

    house.add(roof);


    const door =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.2,
                2.2,
                .2
            ),

            new THREE.MeshStandardMaterial({
                color:0x4b2b18
            })

        );

    door.position.set(
        0,
        1.1,
        -2.6
    );

    house.add(door);

    house.position.set(
        x,
        0,
        z
    );

    world.add(house);
}


createHouse(-10,8,0x8b3cff);
createHouse(2,11,0x327eff);
createHouse(13,5,0xffa43b);
createHouse(-18,1,0x36b97c);


/* =========================================
   LIFE SKILL BUILDINGS
========================================= */

function createMarker(
    x,
    z,
    label,
    color
){

    const group =
        new THREE.Group();

    const pillar =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .35,
                .35,
                3,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:color,
                emissive:color,
                emissiveIntensity:1
            })

        );

    pillar.position.y=1.5;

    group.add(pillar);


    const ring =
        new THREE.Mesh(

            new THREE.TorusGeometry(
                1.4,
                .08,
                8,
                32
            ),

            new THREE.MeshBasicMaterial({
                color:color
            })

        );

    ring.rotation.x =
        Math.PI/2;

    ring.position.y=.15;

    group.add(ring);

    group.position.set(
        x,
        0,
        z
    );

    world.add(group);

    return group;
}


const markers=[];

markers.push(
    createMarker(
        -24,
        14,
        "COOK",
        0xff9c42
    )
);

markers.push(
    createMarker(
        22,
        17,
        "MONEY",
        0x55eaff
    )
);

markers.push(
    createMarker(
        25,
        -10,
        "HEALTH",
        0x51e89a
    )
);


/* =========================================
   PLAYER
========================================= */

const player =
    new THREE.Group();

scene.add(player);


/* body */

const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .65,
            1.4,
            8,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:0x2468c9,
            roughness:.55
        })

    );

body.position.y=1.5;

body.castShadow=true;

player.add(body);


/* head */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .7,
            24,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:0xf0b98b,
            roughness:.8
        })

    );

head.position.y=3;

head.castShadow=true;

player.add(head);


/* hair */

const hair =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .73,
            16,
            12,
            0,
            Math.PI*2,
            0,
            Math.PI*.55
        ),

        new THREE.MeshStandardMaterial({
            color:0x211a18
        })

    );

hair.position.y=3.25;

player.add(hair);


/* cape */

const cape =
    new THREE.Mesh(

        new THREE.ConeGeometry(
            1,
            2.8,
            4
        ),

        new THREE.MeshStandardMaterial({
            color:0x45258e,
            roughness:.7,
            side:THREE.DoubleSide
        })

    );

cape.position.set(
    0,
    1.7,
    .65
);

cape.rotation.x =
    Math.PI;

cape.castShadow=true;

player.add(cape);


/* =========================================
   PLAYER POSITION
========================================= */

player.position.set(
    0,
    0,
    8
);


/* =========================================
   CONTROLS
========================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


/* =========================================
   CAMERA
========================================= */

const cameraTarget =
    new THREE.Vector3();

let cameraYaw=0;
let cameraPitch=.42;

let mouseDown=false;
let lastMouseX=0;
let lastMouseY=0;


renderer.domElement.addEventListener(
    "mousedown",
    e=>{

        mouseDown=true;

        lastMouseX=e.clientX;
        lastMouseY=e.clientY;

    }
);

window.addEventListener(
    "mouseup",
    ()=>{
        mouseDown=false;
    }
);

window.addEventListener(
    "mousemove",
    e=>{

        if(!mouseDown) return;

        const dx =
            e.clientX-lastMouseX;

        const dy =
            e.clientY-lastMouseY;

        cameraYaw -= dx*.004;

        cameraPitch -= dy*.003;

        cameraPitch =
            THREE.MathUtils.clamp(
                cameraPitch,
                .15,
                1.1
            );

        lastMouseX=e.clientX;
        lastMouseY=e.clientY;

    }
);


/* =========================================
   MOVEMENT
========================================= */

let velocityY=0;
let grounded=true;

const playerSpeed=.11;

function updatePlayer(){

    let dx=0;
    let dz=0;

    if(keys["w"]) dz-=1;
    if(keys["s"]) dz+=1;
    if(keys["a"]) dx-=1;
    if(keys["d"]) dx+=1;

    const moving =
        dx!==0 || dz!==0;

    if(moving){

        const length =
            Math.sqrt(
                dx*dx+dz*dz
            );

        dx/=length;
        dz/=length;

        const angle =
            Math.atan2(dx,dz)
            +cameraYaw;

        const speed =
            keys["shift"]
            ? playerSpeed*2
            : playerSpeed;

        player.position.x +=
            Math.sin(angle)*speed;

        player.position.z +=
            Math.cos(angle)*speed;

        player.rotation.y =
            angle;

        /* walking animation */

        body.rotation.z =
            Math.sin(
                performance.now()*.012
            )*.04;

        cape.rotation.z =
            Math.sin(
                performance.now()*.01
            )*.06;

    }else{

        body.rotation.z=0;
        cape.rotation.z=0;

    }

    /* boundaries */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -55,
            55
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -55,
            55
        );


    /* jump */

    if(
        keys[" "] &&
        grounded
    ){

        velocityY=.18;
        grounded=false;

    }

    velocityY-=.009;

    player.position.y+=velocityY;

    if(player.position.y<=0){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }

}


/* =========================================
   CAMERA FOLLOW
========================================= */

function updateCamera(){

    const distance=14;

    const horizontal =
        Math.cos(cameraPitch)*distance;

    const x =
        player.position.x
        +Math.sin(cameraYaw)
        *horizontal;

    const z =
        player.position.z
        +Math.cos(cameraYaw)
        *horizontal;

    const y =
        player.position.y
        +Math.sin(cameraPitch)
        *distance
        +4;

    camera.position.lerp(
        new THREE.Vector3(
            x,
            y,
            z
        ),
        .08
    );

    cameraTarget.set(
        player.position.x,
        player.position.y+1.7,
        player.position.z
    );

    camera.lookAt(
        cameraTarget
    );
}


/* =========================================
   CRYSTAL ANIMATION
========================================= */

function animateCrystals(){

    crystals.forEach(
        (crystal,i)=>{

            crystal.rotation.y += .01;

            crystal.position.y =
                Math.sin(
                    performance.now()*.002+i
                )*.15;

        }
    );

    markers.forEach(
        (marker,i)=>{

            marker.rotation.y += .008;

            marker.position.y =
                Math.sin(
                    performance.now()*.002+i
                )*.15;

        }
    );
}


/* =========================================
   XP SYSTEM
========================================= */

let xp=0;
let gems=10;
let level=1;

function addXP(amount){

    xp+=amount;

    if(xp>=100){

        xp-=100;
        level++;

        gems+=5;

    }

    document.getElementById(
        "xp"
    ).textContent=xp;

    document.getElementById(
        "gems"
    ).textContent=gems;

    document.getElementById(
        "level"
    ).textContent=level;

    document.getElementById(
        "xp-fill"
    ).style.width =
        xp+"%";

    document.getElementById(
        "questProgress"
    ).style.width =
        Math.min(xp,100)+"%";
}


/* Give XP when player explores */

let lastXPPosition =
    new THREE.Vector3();

setInterval(()=>{

    const distance =
        player.position.distanceTo(
            lastXPPosition
        );

    if(distance>8){

        addXP(5);

        lastXPPosition.copy(
            player.position
        );

        document.getElementById(
            "questText"
        ).textContent =
            "Great! Keep exploring the kingdom and discover more life skills.";

    }

},2000);


/* =========================================
   LOCATION DETECTION
========================================= */

const locationBox =
    document.getElementById(
        "location"
    );

function updateLocation(){

    let text="Kingdom of Skills";

    if(player.position.z<-20)
        text="🏰 Royal Castle";

    else if(
        player.position.x<-15 &&
        player.position.z>5
    )
        text="🍳 Cooking Village";

    else if(
        player.position.x>15 &&
        player.position.z>5
    )
        text="💰 Financial District";

    else if(
        player.position.x>15 &&
        player.position.z<-5
    )
        text="❤️ Health Village";

    locationBox.textContent=text;

    locationBox.style.opacity=1;

}


/* =========================================
   MOBILE CONTROLS
========================================= */

document
.querySelectorAll(".mobile-btn")
.forEach(button=>{

    const key =
        button.dataset.key;

    button.addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();
            keys[key]=true;

        }
    );

    button.addEventListener(
        "touchend",
        e=>{

            e.preventDefault();
            keys[key]=false;

        }
    );

});


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================
   ANIMATION LOOP
========================================= */

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const elapsed =
        clock.getElapsedTime();

    /* water animation */

    water.material.opacity =
        .66 +
        Math.sin(elapsed)*.04;

    /* player */

    updatePlayer();

    updateCamera();

    animateCrystals();

    updateLocation();

    /* render */

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================================
   STARTING QUEST
========================================= */

setTimeout(()=>{

    document.getElementById(
        "questText"
    ).textContent =
        "Explore the kingdom using W A S D. Your first mission is to discover a life-skill location.";

},3000);

</script>
