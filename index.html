<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillShareJR — Life Skills Kingdom</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#061326;
}

#game{
    width:100%;
    height:100%;
    display:block;
}

/* TOP LEFT */
.logo{
    position:absolute;
    top:24px;
    left:25px;
    padding:18px 25px;
    border:1px solid #269cff;
    border-radius:22px;
    background:rgba(3,18,38,.88);
    color:white;
    box-shadow:0 0 25px rgba(0,150,255,.25);
    z-index:10;
}

.logo h1{
    color:#45b7ff;
    font-size:28px;
    letter-spacing:1px;
}

.logo p{
    margin-top:5px;
    color:#c6dbef;
}

/* STATS */
.stats{
    position:absolute;
    right:25px;
    top:25px;
    width:250px;
    padding:20px;
    border:1px solid #d8a928;
    border-radius:22px;
    background:rgba(3,18,38,.9);
    color:white;
    z-index:10;
}

.stat{
    margin:8px 0;
}

.stat span{
    color:#9eb3ca;
}

.stat strong{
    display:block;
    font-size:23px;
}

/* QUEST */
.quest{
    position:absolute;
    left:25px;
    bottom:25px;
    width:410px;
    padding:20px;
    border:1px solid #9b62ff;
    border-radius:22px;
    background:rgba(3,18,38,.92);
    color:white;
    z-index:10;
}

.quest h3{
    color:#c79cff;
    margin-bottom:10px;
}

.quest p{
    font-size:17px;
}

/* CONTROLS */
.controls{
    position:absolute;
    right:25px;
    bottom:25px;
    padding:18px 24px;
    border:1px solid #2873a8;
    border-radius:18px;
    background:rgba(3,18,38,.9);
    color:#d8eaff;
    z-index:10;
}

#message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:25px 35px;
    border-radius:20px;
    background:rgba(4,22,43,.94);
    border:1px solid #3dafff;
    color:white;
    font-size:20px;
    text-align:center;
    display:none;
    z-index:20;
    box-shadow:0 0 40px rgba(0,160,255,.3);
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:0;
    border-radius:10px;
    background:#168cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="logo">
    <h1>⚔ SKILLSHAREJR</h1>
    <p>MASTER LIFE SKILLS • BUILD YOUR KINGDOM</p>
</div>

<div class="stats">
    <div class="stat">⭐ <span>EXPERIENCE</span><strong id="xp">0 XP</strong></div>
    <div class="stat">💎 <span>GEMS</span><strong id="gems">10</strong></div>
    <div class="stat">🏆 <span>LEVEL</span><strong id="level">1</strong></div>
</div>

<div class="quest">
    <h3>📜 CURRENT QUEST</h3>
    <p id="questText">
        Explore the kingdom and discover your first life skill.
    </p>
</div>

<div class="controls">
    🎮 <b>W A S D</b> — Move<br>
    🖱️ <b>Click a building</b> — Learn
</div>

<div id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const canvas = document.getElementById("game");

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x061326);

scene.fog = new THREE.Fog(
    0x061326,
    25,
    120
);


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

camera.position.set(0,8,16);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;


/* =========================
   LIGHTS
========================= */

const ambient = new THREE.HemisphereLight(
    0x8fc9ff,
    0x172033,
    2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    -30,
    50,
    20
);

sun.castShadow = true;

scene.add(sun);


/* =========================
   GROUND
========================= */

const groundGeometry =
    new THREE.CylinderGeometry(
        50,
        50,
        1,
        64
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x23472d,
        roughness:.9
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.position.y = -0.5;
ground.receiveShadow = true;

scene.add(ground);


/* =========================
   PATH
========================= */

function createPath(x,z,w,d){

    const geometry =
        new THREE.BoxGeometry(
            w,
            .15,
            d
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x9a7b52
        });

    const path =
        new THREE.Mesh(
            geometry,
            material
        );

    path.position.set(x,0.08,z);

    scene.add(path);
}

createPath(0,0,8,100);
createPath(0,0,100,8);


/* =========================
   BUILDING FUNCTION
========================= */

const buildings = [];

function createBuilding(
    x,
    z,
    color,
    name,
    icon
){

    const group = new THREE.Group();

    /* MAIN BUILDING */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                4,
                5
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                roughness:.65
            })
        );

    body.position.y=2;
    body.castShadow=true;
    body.receiveShadow=true;

    group.add(body);


    /* ROOF */

    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                3.8,
                3,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x202b48
            })
        );

    roof.position.y=5.5;
    roof.rotation.y=Math.PI/4;

    roof.castShadow=true;

    group.add(roof);


    /* DOOR */

    const door =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                2,
                .2
            ),
            new THREE.MeshStandardMaterial({
                color:0x171717
            })
        );

    door.position.set(
        0,
        1,
        -2.55
    );

    group.add(door);


    /* GLOW */

    const glow =
        new THREE.PointLight(
            color,
            3,
            12
        );

    glow.position.set(
        0,
        3,
        -3
    );

    group.add(glow);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    buildings.push({
        object:group,
        name:name,
        icon:icon
    });

    return group;
}


/* =========================
   KINGDOM BUILDINGS
========================= */

createBuilding(
    -18,
    -18,
    0x2d8cff,
    "Communication Academy",
    "💬"
);

createBuilding(
    18,
    -18,
    0xff9d32,
    "Money Mastery",
    "💰"
);

createBuilding(
    -18,
    18,
    0x38c978,
    "Healthy Living",
    "❤️"
);

createBuilding(
    18,
    18,
    0xb65cff,
    "Home Skills",
    "🏠"
);


/* =========================
   CASTLE
========================= */

const castle = new THREE.Group();

const castleBody =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            10,
            8,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x60749b
        })
    );

castleBody.position.y=4;
castleBody.castShadow=true;

castle.add(castleBody);


/* towers */

for(let x of [-5,5]){

    for(let z of [-4,4]){

        const tower =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    2,
                    2,
                    10,
                    16
                ),
                new THREE.MeshStandardMaterial({
                    color:0x7086ad
                })
            );

        tower.position.set(
            x,
            5,
            z
        );

        tower.castShadow=true;

        castle.add(tower);


        const roof =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    2.5,
                    4,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x284f9b
                })
            );

        roof.position.set(
            x,
            12,
            z
        );

        castle.add(roof);
    }
}

castle.position.set(
    0,
    0,
    -30
);

scene.add(castle);


/* =========================
   TREES
========================= */

function createTree(x,z){

    const tree=new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .4,
                .55,
                2.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x70452b
            })
        );

    trunk.position.y=1.25;

    tree.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x1e7138
            })
        );

    leaves.position.y=3;

    leaves.castShadow=true;

    tree.add(leaves);

    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);
}


for(let i=0;i<35;i++){

    const x =
        (Math.random()-0.5)*80;

    const z =
        (Math.random()-0.5)*80;

    if(Math.abs(x)<10 && Math.abs(z)<10)
        continue;

    createTree(x,z);
}


/* =========================
   PLAYER
========================= */

const player = new THREE.Group();

const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .7,
            1.4,
            8,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0x247cff
        })
    );

body.position.y=1.4;

body.castShadow=true;

player.add(body);


/* HEAD */

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .6,
            16,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0xffc39b
        })
    );

head.position.y=2.8;

head.castShadow=true;

player.add(head);


/* CAPE */

const cape =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.7,
            2.2,
            .25
        ),
        new THREE.MeshStandardMaterial({
            color:0x6525b8
        })
    );

cape.position.set(
    0,
    1.5,
    .65
);

player.add(cape);


player.position.set(
    0,
    0,
    8
);

scene.add(player);


/* =========================
   MOVEMENT
========================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);

const speed=.18;


/* =========================
   XP SYSTEM
========================= */

let xp=0;
let gems=10;

function addXP(amount){

    xp+=amount;

    document.getElementById(
        "xp"
    ).textContent=xp+" XP";

    if(xp>=100){

        document.getElementById(
            "level"
        ).textContent=
        Math.floor(xp/100)+1;
    }
}


/* =========================
   CLICK BUILDINGS
========================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

window.addEventListener(
    "click",
    event=>{

        mouse.x =
        (event.clientX/window.innerWidth)*2-1;

        mouse.y =
        -(event.clientY/window.innerHeight)*2+1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits =
        raycaster.intersectObjects(
            buildings.map(b=>b.object),
            true
        );

        if(hits.length){

            let object=hits[0].object;

            let building=null;

            while(object){

                building =
                buildings.find(
                    b=>b.object===object
                );

                if(building) break;

                object=object.parent;
            }

            if(building){

                const message =
                document.getElementById(
                    "message"
                );

                message.innerHTML=
                building.icon+
                "<br><br><b>"+
                building.name+
                "</b><br><br>"+
                "Complete this life-skill challenge to earn XP!"+
                "<br><button onclick='closeMessage()'>START CHALLENGE</button>";

                message.style.display="block";

                addXP(10);
            }
        }
    }
);

function closeMessage(){

    document.getElementById(
        "message"
    ).style.display="none";

    document.getElementById(
        "questText"
    ).textContent=
    "Great job! You discovered a new life skill. Explore another building.";
}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    const target =
    new THREE.Vector3(
        player.position.x,
        player.position.y+7,
        player.position.z+13
    );

    camera.position.lerp(
        target,
        .08
    );

    camera.lookAt(
        player.position.x,
        player.position.y+1,
        player.position.z
    );
}


/* =========================
   GAME LOOP
========================= */

function animate(){

    requestAnimationFrame(animate);

    if(keys["w"])
        player.position.z-=speed;

    if(keys["s"])
        player.position.z+=speed;

    if(keys["a"])
        player.position.x-=speed;

    if(keys["d"])
        player.position.x+=speed;


    /* world boundaries */

    player.position.x=
    THREE.MathUtils.clamp(
        player.position.x,
        -43,
        43
    );

    player.position.z=
    THREE.MathUtils.clamp(
        player.position.z,
        -43,
        43
    );


    /* walking animation */

    if(
        keys["w"] ||
        keys["a"] ||
        keys["s"] ||
        keys["d"]
    ){

        body.rotation.z=
        Math.sin(
            Date.now()*.015
        )*.08;
    }


    /* floating magical effect */

    buildings.forEach(
        (b,i)=>{

            b.object.position.y=
            Math.sin(
                Date.now()*.001+i
            )*.03;
        }
    );


    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        window.innerWidth/
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
