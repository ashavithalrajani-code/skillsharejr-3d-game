<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SkillShareJR — Kingdom of Skills V6</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#06111c;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* TOP LEFT */

.logo{
    position:fixed;
    left:25px;
    top:22px;
    padding:18px 25px;
    border:1px solid #35cfff;
    border-radius:20px;
    background:rgba(4,17,32,.88);
    box-shadow:
        0 0 25px rgba(0,180,255,.18),
        inset 0 0 25px rgba(0,100,255,.05);
    color:white;
    z-index:20;
}

.logo h1{
    color:#48d9ff;
    font-size:29px;
    letter-spacing:2px;
}

.logo p{
    color:#b8cce0;
    margin-top:5px;
    font-size:14px;
}

/* STATS */

.stats{
    position:fixed;
    right:25px;
    top:22px;
    width:245px;
    padding:20px;
    border:1px solid #e4b72f;
    border-radius:20px;
    background:rgba(4,17,32,.9);
    color:white;
    z-index:20;
}

.stat{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    font-size:17px;
}

.stat span{
    color:#a8bdd2;
}

.stat b{
    color:white;
}

/* QUEST */

.quest{
    position:fixed;
    left:25px;
    bottom:25px;
    width:410px;
    padding:20px;
    border:1px solid #9c65ff;
    border-radius:20px;
    background:rgba(5,14,29,.93);
    color:white;
    z-index:20;
    box-shadow:0 0 25px rgba(130,70,255,.15);
}

.quest-title{
    color:#d59cff;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.quest-text{
    color:#e8eef7;
    line-height:1.5;
}

/* CONTROLS */

.controls{
    position:fixed;
    right:25px;
    bottom:25px;
    padding:17px 22px;
    border:1px solid #1d8ac0;
    border-radius:18px;
    background:rgba(4,17,32,.93);
    color:#dceeff;
    z-index:20;
    line-height:1.65;
}

.controls b{
    color:#63dcff;
}

/* LOCATION INFO */

.location{
    position:fixed;
    left:50%;
    top:22px;
    transform:translateX(-50%);
    padding:12px 25px;
    border-radius:30px;
    border:1px solid rgba(100,220,255,.5);
    background:rgba(3,15,28,.8);
    color:#dff7ff;
    z-index:20;
    opacity:0;
    transition:.3s;
}

.location.show{
    opacity:1;
}

/* CROSSHAIR */

.crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,255,255,.7);
    border-radius:50%;
    z-index:15;
    pointer-events:none;
}

/* LEARNING MODAL */

#modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.card{
    width:min(720px,90vw);
    max-height:85vh;
    overflow:auto;
    padding:30px;
    border-radius:25px;
    background:
        linear-gradient(145deg,#10253a,#071322);
    border:1px solid #38cfff;
    box-shadow:
        0 0 50px rgba(0,190,255,.2),
        inset 0 0 30px rgba(40,120,255,.05);
    color:white;
}

.card h2{
    font-size:30px;
    color:#52d9ff;
    margin-bottom:10px;
}

.card .subtitle{
    color:#a9c3d9;
    margin-bottom:22px;
}

.lesson{
    margin:15px 0;
    padding:16px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
}

.lesson h3{
    color:#ffd45a;
    margin-bottom:8px;
}

.lesson p{
    color:#d7e3ed;
    line-height:1.55;
}

.quiz{
    margin-top:20px;
    padding:18px;
    border-radius:15px;
    background:rgba(120,80,255,.1);
}

.quiz button{
    display:block;
    width:100%;
    margin:8px 0;
    padding:12px;
    border-radius:10px;
    border:1px solid #315d82;
    background:#0b1d31;
    color:white;
    cursor:pointer;
    text-align:left;
}

.quiz button:hover{
    background:#153754;
}

.close{
    margin-top:20px;
    padding:13px 25px;
    border:0;
    border-radius:12px;
    background:#24bde8;
    color:#00131d;
    font-weight:bold;
    cursor:pointer;
}

/* MINIMAP */

#minimap{
    position:fixed;
    right:285px;
    bottom:25px;
    width:150px;
    height:150px;
    border:2px solid rgba(100,210,255,.7);
    border-radius:14px;
    background:#0b2331;
    overflow:hidden;
    z-index:20;
}

#miniCanvas{
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div id="game"></div>

<div class="logo">
    <h1>⚔ SKILLSHAREJR</h1>
    <p>MASTER LIFE SKILLS • BUILD YOUR KINGDOM</p>
</div>

<div class="stats">
    <div class="stat"><span>⭐ EXPERIENCE</span><b id="xp">0 XP</b></div>
    <div class="stat"><span>💎 GEMS</span><b id="gems">10</b></div>
    <div class="stat"><span>🏆 LEVEL</span><b id="level">1</b></div>
</div>

<div class="quest">
    <div class="quest-title">📜 CURRENT QUEST</div>

        Explore the Kingdom and discover your first life skill.

</div>

<div class="controls">
    🎮 <b>W A S D</b> — Move<br>
    🖱️ <b>Mouse</b> — Look around<br>
    ⚡ <b>SHIFT</b> — Sprint<br>
    🏛️ Walk near a location — <b>Learn</b>
</div>

<div class="crosshair"></div>

<div id="minimap">
    <canvas id="miniCanvas" width="150" height="150"></canvas>
</div>

<div id="modal">
    <div class="card">
        <h2 id="lessonTitle">Skill</h2>
        <div class="subtitle" id="lessonSubtitle"></div>

        <div id="lessonContent"></div>

        <div class="quiz">
            <strong>🧠 QUICK CHALLENGE</strong>
            <p id="question" style="margin:10px 0"></p>

            <button onclick="answer(0)" id="answer0"></button>
            <button onclick="answer(1)" id="answer1"></button>
            <button onclick="answer(2)" id="answer2"></button>

            <div id="result" style="margin-top:12px"></div>

        <button class="close" onclick="closeLesson()">Return to Kingdom</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   GAME SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x071727);

scene.fog = new THREE.FogExp2(
    0x071727,
    0.007
);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const hemi = new THREE.HemisphereLight(
    0x9ddcff,
    0x14251a,
    1.7
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffe4b0,
    2.4
);

sun.position.set(
    -80,
    100,
    60
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =========================================================
   TERRAIN
========================================================= */

const WORLD = 220;

function heightAt(x,z){

    let h =
        Math.sin(x*.035)*4 +
        Math.cos(z*.04)*3 +
        Math.sin((x+z)*.025)*5;

    const mountain =
        Math.max(
            0,
            1-Math.sqrt(
                (x-65)*(x-65)+
                (z+65)*(z+65)
            )/65
        );

    h += mountain * 18;

    return h;
}

const terrainGeo =
    new THREE.PlaneGeometry(
        WORLD,
        WORLD,
        100,
        100
    );

terrainGeo.rotateX(-Math.PI/2);

const pos =
    terrainGeo.attributes.position;

for(let i=0;i<pos.count;i++){

    const x = pos.getX(i);
    const z = pos.getZ(i);

    pos.setY(
        i,
        heightAt(x,z)
    );
}

terrainGeo.computeVertexNormals();

const terrainMat =
    new THREE.MeshStandardMaterial({
        color:0x376b38,
        roughness:1
    });

const terrain =
    new THREE.Mesh(
        terrainGeo,
        terrainMat
    );

terrain.receiveShadow = true;

scene.add(terrain);


/* =========================================================
   WATER
========================================================= */

const waterGeo =
    new THREE.PlaneGeometry(
        75,
        220
    );

waterGeo.rotateX(-Math.PI/2);

const waterMat =
    new THREE.MeshStandardMaterial({
        color:0x126d91,
        transparent:true,
        opacity:.78,
        roughness:.15,
        metalness:.2
    });

const water =
    new THREE.Mesh(
        waterGeo,
        waterMat
    );

water.position.set(
    88,
    1,
    0
);

scene.add(water);


/* =========================================================
   ROADS
========================================================= */

function road(x,z,rot,length){

    const geo =
        new THREE.BoxGeometry(
            7,
            .12,
            length
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:0x8b704d
        });

    const mesh =
        new THREE.Mesh(
            geo,
            mat
        );

    mesh.position.set(
        x,
        heightAt(x,z)+.1,
        z
    );

    mesh.rotation.y = rot;

    mesh.receiveShadow=true;

    scene.add(mesh);
}

road(0,0,0,170);
road(-45,0,Math.PI/2,90);
road(45,0,Math.PI/2,100);
road(0,-45,Math.PI/2,80);
road(0,45,Math.PI/2,80);


/* =========================================================
   TREES
========================================================= */

function tree(x,z,scale=1){

    const group =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .45,.65,4,8
            ),
            new THREE.MeshStandardMaterial({
                color:0x70452c
            })
        );

    trunk.position.y=2;

    trunk.castShadow=true;

    group.add(trunk);

    for(let i=0;i<3;i++){

        const crown =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    3.2-i*.5,
                    5,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:
                        i===0
                        ?0x1f6d3d
                        :0x2e8245
                })
            );

        crown.position.y =
            4+i*2.2;

        crown.castShadow=true;

        group.add(crown);
    }

    group.position.set(
        x,
        heightAt(x,z),
        z
    );

    group.scale.setScalar(scale);

    scene.add(group);
}


/* forest generation */

for(let i=0;i<120;i++){

    let x =
        (Math.random()-.5)*190;

    let z =
        (Math.random()-.5)*190;

    if(Math.abs(x)<35 &&
       Math.abs(z)<35) continue;

    if(x>65) continue;

    tree(
        x,
        z,
        .7+Math.random()*.6
    );
}


/* =========================================================
   BUILDINGS
========================================================= */

function building(
    x,
    z,
    color,
    roofColor,
    name
){

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                10,7,9
            ),
            new THREE.MeshStandardMaterial({
                color:color
            })
        );

    body.position.y=3.5;
    body.castShadow=true;

    group.add(body);

    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                7.5,
                5,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:roofColor
            })
        );

    roof.rotation.y=Math.PI/4;

    roof.position.y=9;

    roof.castShadow=true;

    group.add(roof);

    /* door */

    const door =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.8,3,.25
            ),
            new THREE.MeshStandardMaterial({
                color:0x3b2115
            })
        );

    door.position.set(
        0,
        1.5,
        4.6
    );

    group.add(door);

    /* windows */

    for(let sx of [-3,3]){

        const window =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.5,1.5,.2
                ),
                new THREE.MeshStandardMaterial({
                    color:0x8be9ff,
                    emissive:0x184d6a,
                    emissiveIntensity:.8
                })
            );

        window.position.set(
            sx,
            4,
            4.6
        );

        group.add(window);
    }

    group.position.set(
        x,
        heightAt(x,z),
        z
    );

    scene.add(group);

    return group;
}


/* =========================================================
   KINGDOM LOCATIONS
========================================================= */

const locations = [

    {
        name:"Honey Plateau",
        skill:"Financial Wisdom",
        x:-65,
        z:-35,
        color:0xffc928,
        lessons:[
            ["Save First","Saving money helps you prepare for future needs."],
            ["Needs vs Wants","Needs are important things we require. Wants are things we would like."],

        ],

        correct:0
    },

    {

        z:-75,
        color:0x38cfff,
        lessons:[
            ["Strong Passwords","Use long, unique passwords and never share them."],
            ["Phishing","Be careful with unexpected messages asking for passwords or money."],
            ["Privacy","Think carefully before sharing personal information online."]
        ],
        question:"What should you do with a suspicious link?",
        answers:["Click immediately","Check it carefully","Send it to everyone"],
        correct:1
    },

    {
        name:"Hearth Village",

        x:-15,
        z:10,
        color:0xff8b4a,
        lessons:[
            ["Organization","Keeping belongings organized makes everyday tasks easier."],
            ["Cleaning","A clean environment is safer and more comfortable."],
            ["Planning","Break large household tasks into smaller steps."]
        ],
        question:"What helps keep a room organized?",
        answers:["Putting things anywhere","A regular system","Ignoring the mess"],
        correct:1
    },

    {
        name:"Stormcaller Peaks",
        skill:"Health & First Aid",
        x:55,
        z:-65,
        color:0x55e6c1,
        lessons:[
            ["Emergency Awareness","Stay calm and get help from a trusted adult when needed."],
            ["Basic First Aid","Small injuries should be handled carefully and safely."],
            ["Health Habits","Sleep, nutrition and hygiene support everyday wellbeing."]
        ],
        question:"What is important during an emergency?",
        answers:["Stay calm and seek help","Panic","Hide the problem"],
        correct:0
    },

    {
        name:"Tech Haven",
        skill:"Technology",
        x:55,
        z:-5,
        color:0x6d7cff,
        lessons:[
            ["Technology","Technology can help us learn, communicate and create."],
            ["Responsible Use","Use devices in ways that are safe and respectful."],
            ["Critical Thinking","Not everything online is automatically true."]
        ],
        question:"Should you believe every post online?",
        answers:["Yes","No, check reliable sources","Only if it has a picture"],
        correct:1
    },

    {
        name:"Forgefire Citadel",
        skill:"Problem Solving",
        x:-65,
        z:60,
        color:0xff5c48,
        lessons:[
            ["Identify","First understand what the actual problem is."],
            ["Plan","Think of possible solutions before acting."],
            ["Improve","If a solution fails, learn from it and try again."]
        ],
        question:"What is a useful first step when solving a problem?",
        answers:["Understand the problem","Give up","Ignore it"],
        correct:0
    },

    {
        name:"Celestial Throne",
        skill:"Leadership",
        x:0,
        z:70,
        color:0xb86cff,
        lessons:[
            ["Communication","Good leaders listen as well as speak."],
            ["Teamwork","Strong teams use everyone's strengths."],
            ["Responsibility","Leadership means taking responsibility for decisions."]
        ],
        question:"What makes a good leader?",
        answers:["Listening and responsibility","Ordering everyone around","Never asking questions"],
        correct:0
    }
];


/* =========================================================
   CREATE BUILDINGS + PORTALS
========================================================= */

locations.forEach((loc,i)=>{

    building(
        loc.x,
        loc.z,
        0x27384a,
        loc.color,
        loc.name
    );

    const ring =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                4,
                .35,
                16,
                40
            ),
            new THREE.MeshStandardMaterial({
                color:loc.color,
                emissive:loc.color,
                emissiveIntensity:1
            })
        );

    ring.rotation.x=Math.PI/2;

    ring.position.set(
        loc.x,
        heightAt(loc.x,loc.z)+.4,
        loc.z
    );

    scene.add(ring);

    const crystal =
        new THREE.Mesh(
            new THREE.OctahedronGeometry(1.8),
            new THREE.MeshStandardMaterial({
                color:loc.color,
                emissive:loc.color,
                emissiveIntensity:.7,
                metalness:.4,
                roughness:.2
            })
        );

    crystal.position.set(
        loc.x,
        heightAt(loc.x,loc.z)+8,
        loc.z
    );

    crystal.castShadow=true;

    scene.add(crystal);

    loc.ring=ring;
    loc.crystal=crystal;
});


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Group();

const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            1.05,
            2.4,
            6,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0x174f91,
            roughness:.75
        })
    );

body.position.y=2;

body.castShadow=true;

player.add(body);


const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            1.05,
            20,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0xffc99a
        })
    );

head.position.y=4;

head.castShadow=true;

player.add(head);


/* hair */

const hair =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            1.08,
            16,
            10,
            0,
            Math.PI*2,
            0,
            Math.PI*.55
        ),
        new THREE.MeshStandardMaterial({
            color:0x2a160d
        })
    );

hair.position.y=4.25;

player.add(hair);


/* cape */

const cape =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            1.8,
            3.2,
            4
        ),
        new THREE.MeshStandardMaterial({
            color:0x5525a8,
            side:THREE.DoubleSide
        })
    );

cape.rotation.x=Math.PI;

cape.position.set(
    0,
    2.4,
    -.8
);

cape.castShadow=true;

player.add(cape);


player.position.set(
    0,
    heightAt(0,0)+.2,
    35
);

scene.add(player);


/* =========================================================
   MOVEMENT
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>keys[e.key.toLowerCase()]=true
);

window.addEventListener(
    "keyup",
    e=>keys[e.key.toLowerCase()]=false
);

let yaw=0;
let pitch=.35;

let velocity =
    new THREE.Vector3();


/* mouse camera */

let mouseDown=false;

renderer.domElement.addEventListener(
    "mousedown",
    ()=>{
        mouseDown=true;
        renderer.domElement.requestPointerLock();
    }
);

document.addEventListener(
    "mouseup",
    ()=>{
        mouseDown=false;
    }
);

document.addEventListener(
    "mousemove",
    e=>{

        if(document.pointerLockElement
           !==renderer.domElement)
            return;

        yaw -= e.movementX*.0025;

        pitch -= e.movementY*.002;

        pitch =
            Math.max(
                -.15,
                Math.min(.8,pitch)
            );
    }
);


/* =========================================================
   GAME STATE
========================================================= */

let XP=0;
let gems=10;
let level=1;

function addXP(amount){

    XP += amount;

    level =
        Math.floor(XP/250)+1;

    gems += Math.floor(amount/50);

    document.getElementById("xp")
        .textContent=XP+" XP";

    document.getElementById("gems")
        .textContent=gems;

    document.getElementById("level")
        .textContent=level;
}


/* =========================================================
   LESSON SYSTEM
========================================================= */

let currentLocation=null;
let currentQuestion=null;

function openLesson(loc){

    currentLocation=loc;

    document.getElementById(
        "lessonTitle"
    ).textContent=loc.skill;

    document.getElementById(
        "lessonSubtitle"
    ).textContent=
        "📍 "+loc.name;

    const content=
        document.getElementById(
            "lessonContent"
        );

    content.innerHTML="";

    loc.lessons.forEach(
        lesson=>{

            const div=
                document.createElement("div");

            div.className="lesson";

            div.innerHTML=
                `<h3>${lesson[0]}</h3>
                 <p>${lesson[1]}</p>`;

            content.appendChild(div);
        }
    );

    document.getElementById(
        "question"
    ).textContent=loc.question;

    loc.answers.forEach(
        (a,i)=>{
            document.getElementById(
                "answer"+i
            ).textContent=a;
        }
    );

    currentQuestion=loc.correct;

    document.getElementById(
        "result"
    ).textContent="";

    document.getElementById(
        "modal"
    ).style.display="flex";
}

function closeLesson(){

    document.getElementById(
        "modal"
    ).style.display="none";
}

function answer(choice){

    const result=
        document.getElementById(
            "result"
        );

    if(choice===currentQuestion){

        result.innerHTML=
            "✅ <b style='color:#63ffb0'>Correct!</b> +50 XP";

        addXP(50);

        document.getElementById(
            "quest"
        ).textContent=
            "Excellent! You learned "+
            currentLocation.skill+
            ". Find another location.";

    }else{

        result.innerHTML=
            "❌ Not quite. Read the lesson and try again.";
    }
}


/* =========================================================
   LOCATION DETECTION
========================================================= */

function checkLocations(){

    let nearest=null;
    let nearestDistance=999;

    locations.forEach(loc=>{

        const dx =
            player.position.x-loc.x;

        const dz =
            player.position.z-loc.z;

        const d=
            Math.sqrt(
                dx*dx+dz*dz
            );

        if(d<nearestDistance){

            nearestDistance=d;
            nearest=loc;
        }
    });

    const label=
        document.getElementById(
            "location"
        );

    if(nearest && nearestDistance<15){

        label.textContent=
            "🏛️ "+nearest.name+
            " • "+nearest.skill+
            " • ENTER TO LEARN";

        label.classList.add("show");

        if(keys["enter"]){

            keys["enter"]=false;

            openLesson(nearest);
        }

    }else{

        label.classList.remove("show");
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const distance=15;

    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y+3,
            player.position.z
        );

    const offset =
        new THREE.Vector3(
            Math.sin(yaw)*distance,
            7+pitch*5,
            Math.cos(yaw)*distance
        );

    camera.position.lerp(
        target.clone().add(offset),
        .08
    );

    camera.lookAt(
        target
    );
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(){

    let dx=0;
    let dz=0;

    if(keys["w"]) dz-=1;
    if(keys["s"]) dz+=1;
    if(keys["a"]) dx-=1;
    if(keys["d"]) dx+=1;

    const moving =
        dx!==0 || dz!==0;

    if(moving){

        const length=
            Math.sqrt(
                dx*dx+dz*dz
            );

        dx/=length;
        dz/=length;

        const speed=
            keys["shift"]
            ? .65
            : .35;

        const sin=Math.sin(yaw);
        const cos=Math.cos(yaw);

        player.position.x +=
            (dx*cos-dz*sin)*speed;

        player.position.z +=
            (dx*sin+dz*cos)*speed;

        player.rotation.y =
            Math.atan2(
                dx*cos-dz*sin,
                dz*cos+dx*sin
            );

        body.rotation.z =
            Math.sin(
                performance.now()*.015
            )*.04;
    }

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -95,
            95
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -95,
            95
        );

    player.position.y=
        heightAt(
            player.position.x,
            player.position.z
        )+.2;
}


/* =========================================================
   ANIMATION
========================================================= */

function animateLocations(){

    const t=
        performance.now()*.001;

    locations.forEach(
        loc=>{

            loc.crystal.rotation.y=
                t*.8;

            loc.crystal.position.y=
                heightAt(
                    loc.x,
                    loc.z
                )+8+
                Math.sin(t*2)*.5;

            loc.ring.rotation.z=
                t*.5;
        }
    );
}


/* =========================================================
   MINIMAP
========================================================= */

const mini =
    document.getElementById(
        "miniCanvas"
    );

const ctx=
    mini.getContext("2d");

function drawMiniMap(){

    ctx.clearRect(
        0,0,150,150
    );

    ctx.fillStyle="#123b2b";

    ctx.fillRect(
        0,0,150,150
    );

    /* water */

    ctx.fillStyle="#135f83";

    ctx.fillRect(
        125,0,25,150
    );

    /* roads */

    ctx.strokeStyle="#8e724f";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(75,0);
    ctx.lineTo(75,150);

    ctx.moveTo(0,75);
    ctx.lineTo(150,75);

    ctx.stroke();

    /* locations */

    locations.forEach(
        loc=>{

            const x=
                (loc.x+100)/200*150;

            const y=
                (loc.z+100)/200*150;

            ctx.fillStyle=
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                x,y,4,0,Math.PI*2
            );

            ctx.fill();
        }
    );

    const px=
        (player.position.x+100)/
        200*150;

    const py=
        (player.position.z+100)/
        200*150;

    ctx.fillStyle="#39ddff";

    ctx.beginPath();

    ctx.arc(
        px,py,5,0,Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    updateCamera();

    checkLocations();

    animateLocations();

    drawMiniMap();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>
