<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillShareJR - Life Skills Adventure</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #07111f;
    font-family: Arial, sans-serif;
}

#game {
    width: 100vw;
    height: 100vh;
}

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: white;
    background: rgba(5,15,35,0.82);
    border: 2px solid #4ca7ff;
    border-radius: 15px;
    padding: 15px 20px;
    box-shadow: 0 0 25px rgba(50,150,255,0.5);
}

#hud h1 {
    font-size: 24px;
    color: #6fc5ff;
    margin-bottom: 5px;
}

#hud p {
    font-size: 14px;
    margin-top: 5px;
}

#mission {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    color: white;
    background: rgba(10,20,40,0.85);
    border: 2px solid #ffd35a;
    border-radius: 15px;
    padding: 15px 20px;
    width: 250px;
}

#mission h2 {
    color: #ffd35a;
    font-size: 18px;
    margin-bottom: 8px;
}

#message {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: white;
    background: rgba(5,15,35,0.9);
    border: 2px solid #9d7cff;
    border-radius: 15px;
    padding: 14px 25px;
    text-align: center;
    display: none;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

<h1>⚔️ SkillShareJR</h1>

<p>⭐ XP: <span id="xp">0</span></p>
<p>💎 Gems: <span id="gems">10</span></p>

<p>🎮 W A S D — Move</p>

</div>

<div id="mission">

<h2>📜 CURRENT MISSION</h2>

<p>Explore the Kingdom and discover your first Life Skill.</p>

<br>

<p>🏠 Find the Life Skills Village.</p>

</div>

<div id="message"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =========================================
   SKILLSHAREJR 3D WORLD
========================================= */


// -----------------------------------------
// SCENE
// -----------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8bc7ff);

scene.fog = new THREE.Fog(
    0x8bc7ff,
    40,
    150
);


// -----------------------------------------
// CAMERA
// -----------------------------------------

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);


// -----------------------------------------
// RENDERER
// -----------------------------------------

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


// -----------------------------------------
// LIGHTING
// -----------------------------------------

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sun.position.set(
    30,
    50,
    20
);

sun.castShadow = true;

scene.add(sun);


const ambient = new THREE.HemisphereLight(
    0xbfe5ff,
    0x31552f,
    1.5
);

scene.add(ambient);


// -----------------------------------------
// GROUND
// -----------------------------------------

const groundGeometry =
    new THREE.PlaneGeometry(
        120,
        120
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x397a45
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


// -----------------------------------------
// PATH
// -----------------------------------------

const pathMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xb59b72
    });

const path =
    new THREE.Mesh(
        new THREE.PlaneGeometry(10, 100),
        pathMaterial
    );

path.rotation.x = -Math.PI / 2;

path.position.y = 0.02;

scene.add(path);


// =========================================
// TREES
// =========================================

function createTree(x, z) {

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.35,
                0.45,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x70462a
            })
        );

    trunk.position.y = 1.5;

    trunk.castShadow = true;

    tree.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.7,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x174f2c
            })
        );

    leaves.position.y = 3.5;

    leaves.castShadow = true;

    tree.add(leaves);


    tree.position.set(x, 0, z);

    scene.add(tree);
}


// Create forest

for(let i = 0; i < 35; i++) {

    const x =
        (Math.random() - 0.5) * 100;

    const z =
        (Math.random() - 0.5) * 100;

    if(Math.abs(x) > 8) {

        createTree(x, z);

    }

}


// =========================================
// CASTLE
// =========================================

function createCastle() {

    const castle =
        new THREE.Group();


    const wallMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xddd8c7
        });


    // Main building

    const main =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                14,
                10,
                10
            ),
            wallMaterial
        );

    main.position.y = 5;

    main.castShadow = true;

    castle.add(main);


    // Towers

    const towerPositions = [

        [-8, 5, -5],
        [8, 5, -5],
        [-8, 5, 5],
        [8, 5, 5]

    ];


    towerPositions.forEach(pos => {

        const tower =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    2,
                    2,
                    12,
                    8
                ),
                wallMaterial
            );

        tower.position.set(
            pos[0],
            pos[1],
            pos[2]
        );

        tower.castShadow = true;

        castle.add(tower);


        const roof =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    2.7,
                    4,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x3155b8
                })
            );

        roof.position.set(
            pos[0],
            12,
            pos[2]
        );

        roof.castShadow = true;

        castle.add(roof);

    });


    castle.position.set(
        0,
        0,
        -30
    );


    scene.add(castle);
}

createCastle();


// =========================================
// LIFE SKILLS VILLAGE
// =========================================

function createBuilding(
    x,
    z,
    color,
    name
) {

    const building =
        new THREE.Group();


    const base =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                7,
                5,
                7
            ),
            new THREE.MeshStandardMaterial({
                color: color
            })
        );

    base.position.y = 2.5;

    base.castShadow = true;

    building.add(base);


    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                5.5,
                4,
                4
            ),
            new THREE.MeshStandardMaterial({
                color: 0x202b5c
            })
        );

    roof.rotation.y =
        Math.PI / 4;

    roof.position.y = 7;

    roof.castShadow = true;

    building.add(roof);


    building.position.set(
        x,
        0,
        z
    );


    scene.add(building);

    return building;
}


const homeSkills =
    createBuilding(
        -16,
        -5,
        0xd17b3f,
        "Home Skills"
    );


const moneyKingdom =
    createBuilding(
        16,
        -5,
        0xd0a52c,
        "Money Skills"
    );


const cyberCastle =
    createBuilding(
        -16,
        15,
        0x365acb,
        "Cyber Safety"
    );


const wisdomTower =
    createBuilding(
        16,
        15,
        0x7d46c7,
        "Decision Making"
    );


// =========================================
// PLAYER
// =========================================

const player =
    new THREE.Group();

scene.add(player);


// Body

const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.1,
            1.7,
            0.7
        ),

        new THREE.MeshStandardMaterial({
            color: 0x2468c9
        })

    );

body.position.y = 1.4;

body.castShadow = true;

player.add(body);


// Head

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.5,
            20,
            20
        ),

        new THREE.MeshStandardMaterial({
            color: 0xffc49b
        })

    );

head.position.y = 2.7;

head.castShadow = true;

player.add(head);


// Hair

const hair =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.52,
            16,
            16
        ),

        new THREE.MeshStandardMaterial({
            color: 0x24170e
        })

    );

hair.position.set(
    0,
    3.0,
    -0.05
);

hair.scale.set(
    1,
    0.6,
    1
);

player.add(hair);


// Cloak

const cloak =
    new THREE.Mesh(

        new THREE.ConeGeometry(
            0.9,
            2.3,
            6
        ),

        new THREE.MeshStandardMaterial({
            color: 0x182d66
        })

    );

cloak.rotation.x =
    Math.PI;

cloak.position.set(
    0,
    1.5,
    0.35
);

cloak.castShadow = true;

player.add(cloak);


// Starting position

player.position.set(
    0,
    0,
    20
);


// =========================================
// MOVEMENT
// =========================================

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = true;

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


const speed = 0.18;


// =========================================
// CAMERA
// =========================================

camera.position.set(
    0,
    7,
    32
);


function updatePlayer() {

    let moving = false;


    if(keys["w"]) {

        player.position.z -= speed;

        moving = true;

    }


    if(keys["s"]) {

        player.position.z += speed;

        moving = true;

    }


    if(keys["a"]) {

        player.position.x -= speed;

        moving = true;

    }


    if(keys["d"]) {

        player.position.x += speed;

        moving = true;

    }


    // Keep player in world

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -50,
            50
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -50,
            45
        );


    // Walking animation

    if(moving) {

        body.rotation.z =
            Math.sin(
                Date.now() * 0.02
            ) * 0.08;

    } else {

        body.rotation.z = 0;

    }

}


// =========================================
// CAMERA FOLLOW
// =========================================

function updateCamera() {

    const target =
        new THREE.Vector3(

            player.position.x,

            player.position.y + 7,

            player.position.z + 12

        );


    camera.position.lerp(
        target,
        0.08
    );


    camera.lookAt(
        player.position.x,
        player.position.y + 1.5,
        player.position.z
    );

}


// =========================================
// RESIZE
// =========================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// =========================================
// GAME LOOP
// =========================================

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
